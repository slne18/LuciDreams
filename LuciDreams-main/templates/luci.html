      var auth = firebase.auth();
      if (auth.currentUser) return run();
      return auth.signInAnonymously().then(run);
    }
    appendFirebaseSyncFailure('firebase_auth_unavailable', null, {});
    return run();
  }

  // Sends sleep data.
  function sendSleepData(activeMode) {
    if (!state.pid) return;
    var built = buildSleepSessionPayload(activeMode);
    var doc = built.firestoreDoc;
    var uploadDocs = buildFirestoreUploadDocs(doc);
    if (uploadDocs.length > 1) {
      appendFirebaseSyncFailure('firestore_doc_chunked', null, {
        pid: state.pid || '',
        mode: activeMode || '',
        chunk_count: uploadDocs.length
      });
    }
    if (!db) {
      enqueuePendingSleepDoc(uploadDocs);
      appendFirebaseSyncFailure('firestore_db_unavailable', null, { pid: state.pid || '', mode: activeMode || '' });
      showSnackbar('Not connected. Sending wake survey only.');
      openWakeSurveyIfConfigured(doc, built.surveyData);
      return;
    }
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      doc.server_timestamp = firebase.firestore.FieldValue.serverTimestamp();
    }
    // For Firestore TTL policy: auto-delete session docs after retention window.
    doc.expires_at = new Date(Date.now() + DATA_RETENTION_MS);
    if (!doc.general) doc.general = {};
    doc.general.data_retention_hours = DATA_RETENTION_HOURS;

    var writeSession = function() {
      var p = Promise.resolve();
      uploadDocs.forEach(function(d) {
        p = p.then(function() {
          return db.collection('sleep_studies').doc(String(d.participant_id || state.pid)).collection('sessions').add(d);
        });
      });
      return p
        .then(function() {
          state.motionSamplesForBackend = [];
          state.motionDeltaOnlySamplesForBackend = [];
          state.motionDeltaPlusTilt15SamplesForBackend = [];
          state.soundLog = [];
          console.log('Data synced to Firestore:', activeMode);
          return clearLocalSessionBackupSnapshot(state.pid).then(function() {
            return flushPendingSleepDocs();
          }).then(function() {
            openWakeSurveyIfConfigured(doc, built.surveyData);
          }).catch(function(err2) {
            appendFirebaseSyncFailure('post_success_cleanup_failed', err2, { pid: state.pid || '', mode: activeMode || '' });
            openWakeSurveyIfConfigured(doc, built.surveyData);
          });
        })
        .catch(function(err) {
          console.error(err);
          enqueuePendingSleepDoc(uploadDocs);
          appendFirebaseSyncFailure('firestore_write_failed', err, { pid: state.pid || '', mode: activeMode || '' });
          var code = err && (err.code || err.message) ? String(err.code || err.message) : 'unknown';
          showSnackbar('Sync Error: ' + code + ' (saved locally)');
          openWakeSurveyIfConfigured(doc, built.surveyData);
        });
    };
    ensureAuthThen(writeSession).catch(function(err) {
      console.error(err);
      enqueuePendingSleepDoc(uploadDocs);
      appendFirebaseSyncFailure('auth_before_write_failed', err, { pid: state.pid || '', mode: activeMode || '' });
      var code = err && (err.code || err.message) ? String(err.code || err.message) : 'unknown';
      showSnackbar('Auth Error: ' + code + ' (saved locally)');
      openWakeSurveyIfConfigured(doc, built.surveyData);
    });
  }

  // Handles wake up.
  function wakeUp() {
    if (state.inRemEpisode && state.remEpisodeStartTime) {
      var dur = state.secondsRecorded - state.remEpisodeStartSeconds;
      var trains = state.currentEpisodeTrains ? state.currentEpisodeTrains.slice() : [];
      if (trains.length) {
        var last = trains[trains.length - 1];
        if (last.disruptive && last.end_epoch_sec == null) {
          last.end_epoch_sec = state.secondsRecorded;
          last.duration_sec = state.secondsRecorded - last.disruptive.start_epoch_sec;
        }
      }
      state.remEpisodes.push({
        start_epoch_sec: state.remEpisodeStartSeconds,
        duration_sec: dur,
        device_time_start: state.remEpisodeStartTime,
        trains: trains
      });
      state.inRemEpisode = false;
      state.currentRemEpisodeEntryThreshold = null;
    }
    disableNoSleep();
    if (state.accelHandler) {
      window.removeEventListener('devicemotion', state.accelHandler);
      state.accelHandler = null;
    }
    if (state.motionSampleTimer) clearInterval(state.motionSampleTimer);
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = null;
    if (state.localBackupTimerId) clearInterval(state.localBackupTimerId);
    state.localBackupTimerId = null;
    if (nextTrainTimeoutId) { clearTimeout(nextTrainTimeoutId); nextTrainTimeoutId = null; }
    clearDisruptiveTimeouts();
    cancelScheduledCue();
    stopSound();
    saveLocalSessionBackup('wake_up');
    sendSleepData('wake_final');
    state.appStep = 0;
    state._voiceCheckDone = false;
    state.trainingSkipped = false;
    state.epochs = 0;
    state.totalStimCount = 0;
    render();
  }

  // Applies config data.
  function applyConfigData(pid) {
    state.pid = pid;
    state.beepDurationMs = DEFAULT_BEEP_DURATION_MS;
    state.intervalSeconds = 10;
    state.trainingSkipped = false;
    ensureConditionForTonight(pid);
    state.appStep = 'study';
    render();
    setTimeout(checkNativeApisOnLogin, 800);
    recoverBackupToPendingIfNeeded(pid).then(function() {
      return ensureAuthThen(function() { return flushPendingSleepDocs(); });
    }).catch(function(err) {
      appendFirebaseSyncFailure('login_recovery_or_flush_failed', err, { pid: pid });
    });
  }

  // Saves pasted lab config.
  function savePastedLabConfig(jsonText) {
    try {
      var config = JSON.parse(jsonText);
      if (!config || !config.apiKey) { showSnackbar('Invalid config: need at least apiKey'); return; }
      localStorage.setItem(LAB_CONFIG_KEY, JSON.stringify(config));
      showSnackbar('Lab config saved. Reloading…');
      window.location.reload();
    } catch (e) { showSnackbar('Invalid JSON: ' + (e.message || 'parse error')); }
  }

  // Fetches config.
  function fetchConfig() {
    const pid = (document.getElementById('pidInput') || pidInput).value.trim();
    if (!pid) return;
    if (!validateParticipantId(pid)) {
      showSnackbar('Invalid Participant ID format. Please follow the link on the Store to register to the study, then enter the exact ID you received.', 30000);
      return;
    }
    applyConfigData(pid);
  }

  // Renders.
  function render() {
    const container = document.getElementById('stepContent');
    if (!container) return;
    if (container.classList && container.classList.toggle) {
      container.classList.toggle('training-layout', state.appStep === 'training');
      container.classList.toggle('study-layout', state.appStep === 'study');
    }

    // Handles el.
    function el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        if (k === 'className') e.className = attrs[k];
        else if (k === 'onClick') e.addEventListener('click', attrs[k]);
        else if (k === 'style') Object.assign(e.style, attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
      if (children) children.forEach(function(c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }

    container.innerHTML = '';

    if (state.appStep !== 'training' && state.trainingActive) {
      stopTrainingPhase();
    }
    switch (state.appStep) {
      case -1: {
        container.appendChild(el('p', { className: 'text-title' }, ['Lab setup']));
        container.appendChild(el('p', { className: 'text-body' }, [
          'To connect to your lab\'s database, open the link (or scan the QR code) your researcher sent you in this browser. The app will then use your lab\'s Firebase for this device.'
        ]));
        container.appendChild(el('p', { className: 'text-body', style: { marginTop: '12px', fontSize: '0.9rem' } }, [
          'If you have a Firebase config JSON from your lab, you can paste it below.'
        ]));
        var ta = document.createElement('textarea');
        ta.placeholder = 'Paste Firebase config JSON here (e.g. { "apiKey": "...", "projectId": "...", ... })';
        ta.rows = 4;
        ta.style.width = '100%';
        ta.style.marginTop = '8px';
        ta.style.padding = '8px';
        ta.style.boxSizing = 'border-box';
        container.appendChild(ta);
        container.appendChild(el('div', { style: { height: '12px' } }));
        container.appendChild(el('button', { className: 'btn', onClick: function() { savePastedLabConfig(ta.value); } }, ['Save and connect']));
        break;
      }
      case 0: {
        container.appendChild(el('p', { className: 'text-title' }, ['Enter Participant ID']));
        const input = pidInput.cloneNode(true);
        input.value = state.pid;
        input.id = 'pidInput';
        container.appendChild(input);
        container.appendChild(el('div', { style: { height: '30px' } }));
        const btn = el('button', { className: 'btn', onClick: fetchConfig }, ['Continue']);
        container.appendChild(btn);
        break;
      }
      case 'study': {
        container.appendChild(el('p', { className: 'text-title' }, ['Study description']));
        var panel = el('div', { className: 'study-panel' }, []);
        panel.appendChild(el('p', { className: 'study-lead' }, [
          'A lucid dream is a dream in which you know that you are dreaming. This study looks at whether sounds, lights, or gentle vibrations from your phone can help you have these lucid dreams more often.'
        ]));
        panel.appendChild(el('p', { className: 'study-section-title', style: { marginTop: '12px' } }, ['Instructions']));
        panel.appendChild(el('p', { className: 'study-section-body' }, [
          'Before sleep: You will spend 15 minutes listening to the same signals that the app will play later while you sleep.'
        ]));
        panel.appendChild(el('p', { className: 'study-section-title' }, ['The goal']));
        panel.appendChild(el('p', { className: 'study-section-body' }, [
          'During this time, the app will guide you through a mental exercise. You will learn how to associate those signals with a "lucid mindset"—learning to think clearly about what you are experiencing in the moment. After the initial 5-minute guidance phase, you can allow yourself to fall asleep while the training is playing.'
        ]));
        panel.appendChild(el('p', { className: 'study-section-title' }, ['Waking up']));
        panel.appendChild(el('p', { className: 'study-section-body' }, [
          'As soon as you wake up, just tap the "I’m awake" button on the app.'
        ]));
        container.appendChild(panel);
        container.appendChild(el('div', { className: 'study-cta-wrap' }, [
          el('button', { className: 'btn', onClick: function() { state.appStep = 1; render(); } }, ['Continue'])
        ]));
        break;
      }
      case 1: {
        if (!state._voiceCheckDone) {
          state._voiceCheckDone = true;
          hasVoiceForPid(state.pid, function(has) { state.hasVoiceRecording = has; render(); });
        }
        container.appendChild(el('p', { className: 'text-title' }, ['Record your cue']));
        container.appendChild(el('p', { className: 'text-body', style: { whiteSpace: 'pre-line', textAlign: 'left' } }, [
          'Record a short sentence (2–4 seconds): "I am dreaming."\n\nTap Record, then speak clearly. Stop when done.'
        ]));
        if (state.hasVoiceRecording) {
          container.appendChild(el('button', { className: 'btn', onClick: function() { state.appStep = 2; state._voiceCheckDone = false; state.trainingComplete = false; render(); } }, ['Continue']));
          container.appendChild(el('div', { style: { height: '8px' } }));
          container.appendChild(el('button', { className: 'btn', onClick: function() { state._recordingAgain = true; state.hasVoiceRecording = false; state._voiceCheckDone = true; render(); } }, ['Record again (replaces previous)']));
        } else {
          var recDiv = document.createElement('div');
          recDiv.id = 'voiceRecDiv';
          recDiv.className = 'voice-rec-block';
          var recRow = document.createElement('div');
          recRow.className = 'voice-rec-row';
          var recBtn = el('button', { className: 'btn', id: 'voiceRecBtn' }, ['Record (2–4 s)']);
          var stopBtn = el('button', { className: 'btn btn-red', id: 'voiceStopBtn', style: { display: 'none' } }, ['Stop']);
          var recDuration = document.createElement('span');
          recDuration.id = 'voiceDuration';
          recDuration.className = 'voice-duration';
          recDuration.textContent = '0.0 s';
          recRow.appendChild(recBtn);
          recRow.appendChild(stopBtn);
          recRow.appendChild(recDuration);
          recDiv.appendChild(recRow);
          container.appendChild(recDiv);
          (function() {
            var mediaRecorder = null;
            var chunks = [];
            var startTs = 0;
            var durationInterval = null;
            var usingNativeVoiceRecorder = false;
            var VR = getVoiceRecorderPlugin();
            function resetRecordButtons() {
              var rb = document.getElementById('voiceRecBtn');
              var sb = document.getElementById('voiceStopBtn');
              if (rb) rb.style.display = '';
              if (sb) sb.style.display = 'none';
            }
            function saveRecordedBlob(blob, durationMs) {
              if (durationMs != null && durationMs < VOICE_RECORD_MIN_MS) {
                showSnackbar('Record at least 2 seconds.');
                resetRecordButtons();
                return;
              }
              if (durationMs != null && durationMs > VOICE_RECORD_MAX_MS + 50) {
                showSnackbar('Recording must be 4 seconds maximum.');
                resetRecordButtons();
                return;
              }
              setVoiceBlob(state.pid, blob, function(ok) {
                if (ok) {
                  state.hasVoiceRecording = true;
                  state.appStep = 2;
                } else showSnackbar('Could not save recording.');
                render();
              });
            }
            function showMicrophonePermissionHelp(err) {
              var diag = buildMicDiagnostic(err, 'n/a', 'n/a', 'record_step');
              window.luciLastMicDiag = diag;
              var name = err && err.name ? String(err.name) : '';
              if (name === 'NotReadableError') {
                showSnackbar('Microphone is busy/unavailable. ' + diag, 30000);
                return;
              }
              showSnackbar('Microphone access denied or blocked. ' + diag, 30000);
            }
            // Updates duration.
            function updateDuration() {
              var el = document.getElementById('voiceDuration');
              if (!el) return;
              var sec = ((Date.now() - startTs) / 1000).toFixed(1);
              el.textContent = sec + ' s';
              if (Date.now() - startTs >= VOICE_RECORD_MAX_MS) stopRecording();
            }
            // Stops recording.
            function stopRecording() {
              if (durationInterval) clearInterval(durationInterval);
              durationInterval = null;
              if (usingNativeVoiceRecorder && VR && typeof VR.stopRecording === 'function') {
                VR.stopRecording().then(function(rec) {
                  usingNativeVoiceRecorder = false;
                  var value = rec && rec.value ? rec.value : rec;
                  if (!value || !value.recordDataBase64) {
                    showSnackbar('Native recorder returned empty audio data.', 10000);
                    resetRecordButtons();
                    return;
                  }
                  var mime = value.mimeType || 'audio/aac';
                  var blob = base64ToBlob(value.recordDataBase64, mime);
                  var durationMs = value.msDuration != null ? Number(value.msDuration) : null;
                  saveRecordedBlob(blob, durationMs);
                }).catch(function(err) {
                  usingNativeVoiceRecorder = false;
                  showSnackbar('Stop native recording failed: ' + buildMicDiagnostic(err, 'native_plugin', 'native_plugin', 'voice_recorder_stop'), 10000);
                  resetRecordButtons();
                });
                return;
              }
              if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }
            // Handles on record click.
            function onRecordClick() {
              if (USE_NATIVE_VOICE_RECORDER_PLUGIN && isNativeAndroidPlatform() && VR) {
                var rb0 = document.getElementById('voiceRecBtn');
                var sb0 = document.getElementById('voiceStopBtn');
                if (rb0) rb0.style.display = 'none';
                if (sb0) sb0.style.display = '';
                VR.requestAudioRecordingPermission()
                  .then(function(perm) {
                    if (!perm || !perm.value) throw new Error('MISSING_PERMISSION');
                    return VR.startRecording();
                  })
                  .then(function() {
                    usingNativeVoiceRecorder = true;
                    startTs = Date.now();
                    durationInterval = setInterval(updateDuration, 200);
                  })
                  .catch(function(err) {
                    usingNativeVoiceRecorder = false;
                    showSnackbar('Native recorder start failed: ' + buildMicDiagnostic(err, 'native_plugin', 'native_plugin', 'voice_recorder_start'), 12000);
                    resetRecordButtons();
                  });
                return;
              }
              if (USE_ANDROID_NATIVE_AUDIO_PICKER_PRIMARY && isNativeAndroidPlatform()) {
                showSnackbar('Opening Android voice recorder...', 2500);
                captureAudioWithAndroidPicker().then(function(blob) {
                  return getBlobDurationMs(blob).then(function(durationMs) {
                    if (durationMs == null) {
                      showSnackbar('Could not read recording length. Keep clips between 2 and 4 seconds.', 7000);
                    }
                    saveRecordedBlob(blob, durationMs);
                  });
                }).catch(function(err) {
                  showSnackbar('Android recorder failed: ' + buildMicDiagnostic(err, 'picker', 'picker', 'record_step_picker'), 12000);
                  resetRecordButtons();
                });
                return;
              }
              if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showSnackbar('Microphone not supported.');
                return;
              }
              acquireMicrophoneStream().then(function(stream) {
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];
                mediaRecorder.ondataavailable = function(e) { if (e.data.size) chunks.push(e.data); };
                mediaRecorder.onstop = function() {
                  stream.getTracks().forEach(function(t) { t.stop(); });
                  var durationMs = Date.now() - startTs;
                  var blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                  saveRecordedBlob(blob, durationMs);
                };
                mediaRecorder.start();
                startTs = Date.now();
                durationInterval = setInterval(updateDuration, 200);
                var rb = document.getElementById('voiceRecBtn');
                var sb = document.getElementById('voiceStopBtn');
                if (rb) rb.style.display = 'none';
                if (sb) sb.style.display = '';
              }).catch(function(err) {
                if (isNativeAndroidPlatform() && err && err.name === 'NotReadableError') {
                  showSnackbar('Web microphone failed, opening Android recorder fallback...', 4000);
                  captureAudioWithAndroidPicker().then(function(blob) {
                    return getBlobDurationMs(blob).then(function(durationMs) {
                      if (durationMs == null) {
                        showSnackbar('Could not read recording length. Keep clips between 2 and 4 seconds.', 7000);
                      }
                      saveRecordedBlob(blob, durationMs);
                    });
                  }).catch(function(fallbackErr) {
                    showSnackbar('Android recorder fallback failed: ' + featureErrorText(fallbackErr), 10000);
                    resetRecordButtons();
                  });
                  return;
                }
                showMicrophonePermissionHelp(err);
                resetRecordButtons();
              });
            }
            // Handles on stop click.
            function onStopClick() { stopRecording(); }
            recBtn.onclick = onRecordClick;
            stopBtn.onclick = onStopClick;
          })();
        }
        break;
      }
      case 'training': {
        startTrainingPhaseIfNeeded();
        container.appendChild(el('p', { className: 'text-title' }, ['Practicing Lucidity']));
        container.appendChild(el('p', { className: 'text-body', style: { marginBottom: '8px' } }, [
          'Listen to the cues and practice recognizing the lucid reminder.'
        ]));
        var controls = document.createElement('div');
        controls.className = 'training-controls';
        var wave = el('div', { className: 'training-wave' });
        controls.appendChild(wave);
        container.appendChild(controls);
        var remaining = Math.max(0, state.trainingRemainingSec || 0);
        var min = Math.floor(remaining / 60);
        var sec = String(remaining % 60).padStart(2, '0');
        container.appendChild(el('p', { className: 'text-body', style: { color: 'var(--text-muted)', fontSize: '0.9rem' } }, [
          'Time remaining: ' + String(min) + ':' + sec
        ]));
        if (SHOW_SKIP_TRAINING) {
          container.appendChild(el('div', { style: { height: '6px' } }));
          container.appendChild(el('button', { className: 'btn btn-red', onClick: skipTrainingPhase }, ['Skip training']));
        }
        break;
      }
      case 2: {
        var needsMotionActivation = !getMotionGranted(state.pid);
        container.appendChild(el('p', { className: 'icon-lg' }, ['🔐']));
        container.appendChild(el('p', { className: 'text-title', style: { color: 'var(--orange-accent)', fontWeight: 'bold' } }, ['IMPORTANT: Your screen must stay ON.']));
        container.appendChild(el('p', { className: 'text-body', style: { whiteSpace: 'pre-line' } }, ['1. Once started, Do NOT switch to another tab or app.\n2. Do NOT lock your phone.\n3. Do NOT close this browser tab.']));
        container.appendChild(el('p', { className: 'text-body', style: { color: '#d32f2f', fontWeight: '700', marginTop: '8px' } }, ['Set the volume to 50% (with the physical buttons or the Control Center slider).']));
        container.appendChild(el('p', { className: 'text-body', style: { color: 'var(--orange-accent)', marginTop: '8px' } }, ['Keep the phone connected to a charging cable and WIFI, and enable Do Not Disturb mode.']));
        container.appendChild(el('div', { className: 'divider' }));
        if (needsMotionActivation) {
          container.appendChild(el('p', { className: 'text-body' }, ['We need to activate your device\'s motion sensor. To accept, click the button below.']));
        }
        container.appendChild(el('div', { style: { height: '40px' } }));
        container.appendChild(el('button', { className: 'btn btn-green', onClick: handleStartSequence }, ['Start night']));
        break;
      }
      case 4: {
        container.appendChild(el('p', { className: 'text-body' }, [
          'All set! We\'re ready for you to go to sleep. Place the phone facedown on the bed with the screen on and keep it connected to the charger.'
        ]));
        container.appendChild(el('div', { style: { height: '24px' } }));
        if (!state.hasVoiceRecording) {
          hasVoiceForPid(state.pid, function(has) { if (has) { state.hasVoiceRecording = true; render(); } });
        }
        var startBtn = el('button', { className: 'btn btn-green', onClick: activateMotionAndStartSleep }, ['Start sleep']);
        if (!state.hasVoiceRecording) {
          startBtn.disabled = true;
          container.appendChild(el('p', { className: 'text-body', style: { fontSize: '0.85rem', color: 'var(--orange-accent)', marginTop: '6px' } }, ['Record your cue (step 1) before starting sleep.']));
        }
        container.appendChild(startBtn);
        break;
      }
      case 5: {
        container.appendChild(el('p', { className: 'text-body' }, [
          'When you wake up tap the button below.'
        ]));
        container.appendChild(el('p', { style: { color: 'var(--green-accent)', fontSize: '1.25rem' } }, ['🌙 Tracking Active']));
        if (state.trainPhase === 'induction') {
          var inductionPct = Math.round((Math.min(state.inductionCap || 1, state.inductionVolume || 0) || 0) * 100);
          container.appendChild(el('p', { className: 'text-body', style: { fontSize: '0.9rem', color: 'var(--text-muted)', marginTop: '2px' } }, [
            'Induction volume: ' + String(inductionPct) + '%'
          ]));
        }
        var elapsedSec = state.secondsRecorded || 0;
        var elapsedStr = Math.floor(elapsedSec / 3600) + ':' + String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0') + ':' + String(elapsedSec % 60).padStart(2, '0');
        container.appendChild(el('p', { id: 'sleepTimer', style: { fontFamily: 'monospace', fontSize: '1.1rem', marginTop: '8px', color: 'var(--primary-accent)' } }, ['Elapsed: ' + elapsedStr]));
        container.appendChild(el('div', { className: 'spinner' }));
        container.appendChild(el('div', { style: { height: '24px' } }));
        container.appendChild(el('button', { className: 'btn btn-red', onClick: wakeUp }, ["I'm awake"]));
        break;
      }
      default:
        container.appendChild(el('p', {}, ['Error']));
    }
  }

  // Handles run when ready.
  function runWhenReady() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runWhenReady);
      return;
    }
    render();
  }
  runWhenReady();
})();
  </script>
