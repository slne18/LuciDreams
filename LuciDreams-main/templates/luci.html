<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuciDreams Web v2026</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Flutter / Material 3 inspired dark theme */
    :root {
      --bg-dark: #0d1117;
      --bg-gradient-end: #161b22;
      --surface: #21262d;
      --surface-elevated: #30363d;
      --surface-overlay: #484f58;
      --primary: #58a6ff;
      --primary-container: rgba(88, 166, 255, 0.16);
      --primary-accent: #79c0ff;
      --green-accent: #3fb950;
      --green-container: rgba(63, 185, 80, 0.16);
      --red-accent: #f85149;
      --red-container: rgba(248, 81, 73, 0.16);
      --orange-accent: #d29922;
      --orange-container: rgba(210, 153, 34, 0.16);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --text-tertiary: #6e7681;
      --outline: rgba(255,255,255,0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --elevation-1: 0 1px 2px rgba(0,0,0,0.24);
      --elevation-2: 0 4px 12px rgba(0,0,0,0.32);
      --elevation-3: 0 8px 24px rgba(0,0,0,0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.luci {
      background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-gradient-end) 100%);
      color: var(--text);
      font-family: "Segoe UI", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    .luci .app-bar {
      width: 100%;
      padding: 20px 20px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--outline);
      box-shadow: var(--elevation-1);
      text-align: center;
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .luci .content {
      flex: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px 32px;
      box-sizing: border-box;
    }
    .luci .step-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--outline);
      box-shadow: var(--elevation-2);
      padding: 28px 24px 32px;
      min-height: 200px;
    }
    .luci .step-content.training-layout {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .luci .step-content.study-layout {
      align-items: stretch;
      text-align: left;
      gap: 14px;
      padding: 24px 20px 28px;
    }
    .luci .study-panel {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
    }
    .luci .study-lead {
      color: var(--text);
      font-size: 0.96rem;
      line-height: 1.55;
      margin: 0;
    }
    .luci .study-section-title {
      color: var(--primary-accent);
      font-size: 0.9rem;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .luci .study-section-body {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.55;
      margin: 0;
    }
    .luci .study-cta-wrap {
      display: flex;
      justify-content: center;
      margin-top: 6px;
      background: transparent;
    }
    .luci input[type="text"] {
      width: 100%;
      max-width: 280px;
      padding: 14px 18px;
      font-size: 1rem;
      background: var(--surface-elevated);
      border: 1.5px solid var(--outline);
      border-radius: var(--radius-md);
      color: var(--text);
      text-align: center;
      box-sizing: border-box;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .luci input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-container);
    }
    .luci input[type="text"]::placeholder {
      color: var(--text-tertiary);
    }
    .luci textarea {
      font-family: inherit;
      font-size: 0.9375rem;
      background: var(--surface-elevated);
      border: 1.5px solid var(--outline);
      border-radius: var(--radius-md);
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .luci textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-container);
    }
    .luci .btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      background: var(--primary);
      color: #0d1117;
      box-shadow: var(--elevation-1);
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      min-height: 48px;
    }
    .luci .btn:hover { box-shadow: 0 4px 12px rgba(88, 166, 255, 0.35); }
    .luci .btn:active { transform: scale(0.98); }
    .luci .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .luci .btn-green {
      background: var(--green-accent);
      color: #0d1117;
    }
    .luci .btn-green:hover { box-shadow: 0 4px 12px rgba(63, 185, 80, 0.35); }
    .luci .btn-red {
      background: var(--red-accent);
      color: #fff;
    }
    .luci .btn-red:hover { box-shadow: 0 4px 12px rgba(248, 81, 73, 0.4); }
    .luci .btn-orange {
      background: var(--orange-accent);
      color: #0d1117;
    }
    .luci .btn-orange:hover { box-shadow: 0 4px 12px rgba(210, 153, 34, 0.35); }
    .luci .text-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.4;
      color: var(--text);
    }
    .luci .text-body {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-muted);
    }
    .luci .text-center { text-align: center; }
    .luci .icon-lg {
      font-size: 3rem;
      margin-bottom: 4px;
      line-height: 1;
    }
    .luci .divider {
      width: 100%;
      height: 1px;
      background: var(--outline);
      margin: 8px 0;
    }
    .luci .row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .luci .volume-display { font-size: 2.5rem; font-weight: 300; letter-spacing: -0.02em; }
    .luci .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--outline);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .luci .voice-rec-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-top: 12px;
      background: transparent !important;
    }
    .luci .voice-rec-block .voice-rec-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: transparent !important;
    }
    .luci .voice-rec-block .voice-duration {
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      color: var(--red-accent);
      min-width: 4ch;
      text-align: center;
      background: transparent !important;
    }
    .luci .voice-rec-block .btn {
      background: var(--primary) !important;
      color: #0d1117 !important;
    }
    .luci .voice-rec-block .btn-red {
      background: var(--red-accent) !important;
      color: #fff !important;
    }
    .luci .training-wave {
      width: 220px;
      height: 72px;
      margin: 14px auto 8px auto;
      border-radius: 14px;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(99, 102, 241, 0.95) 0 8px,
        rgba(148, 163, 184, 0.12) 8px 14px,
        rgba(34, 197, 94, 0.9) 14px 22px,
        rgba(148, 163, 184, 0.12) 22px 28px,
        rgba(59, 130, 246, 0.95) 28px 36px,
        rgba(148, 163, 184, 0.12) 36px 42px
      );
      animation: trainingPulse 1.2s ease-in-out infinite;
    }
    @keyframes trainingPulse {
      0%, 100% { transform: scaleY(0.86); opacity: 0.7; }
      50% { transform: scaleY(1.04); opacity: 1; }
    }
    .luci .training-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 8px 0 6px 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .luci .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--outline);
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .luci .icon-btn:active {
      transform: scale(0.96);
      filter: brightness(0.95);
    }
    .luci .icon-btn-white {
      background: #fff;
      color: #111827;
    }
    .luci .icon-btn-red {
      background: var(--red-accent);
      color: #fff;
      border-color: rgba(239, 68, 68, 0.65);
    }
    .luci .pause-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .luci .pause-glyph .bar {
      width: 4px;
      height: 14px;
      border-radius: 1px;
      background: #fff;
      display: inline-block;
    }
    .luci .play-glyph {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #fff;
      margin-left: 2px;
      display: inline-block;
    }
    .luci .hidden { display: none !important; }
    .luci .snackbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      color: var(--text);
      padding: 14px 24px;
      border-radius: var(--radius-lg);
      font-size: 0.9375rem;
      font-weight: 500;
      box-shadow: var(--elevation-3);
      border: 1px solid var(--outline);
      z-index: 1000;
    }
  </style>

  <script>

  window.luciUseNativeTorch = false;
  window.luciUseNativeHaptics = false;
  window.luciUseNativeAudio = false;
  window.luciNativeBeepPreloaded = false;
  window.luciNativeBeepAssetPath = null;
  window.luciNativeBeepIsUrl = false;
  window.luciNativeBeepVariantsReady = false;
  window.luciNativeBeepVariantsPromise = null;
  window.luciNativeBeepVariantVolumes = (function() {
    var levels = [];

    for (var i = 0; i <= 20; i++) levels.push(i / 200);
    for (var j = 15; j <= 100; j += 5) levels.push(j / 100);
    return levels;
  })();
  window.luciNativeAudioPreloadPromise = null;
  window.luciNativeLongAssetPromises = {};
  window.luciNativeLongAssetPaths = {};
  window.luciNativeLongAssetIsUrl = {};
  window.luciNativeAudioLastError = '';
  // Returns closest beep variant volume.
  function getClosestBeepVariantVolume(vol) {
    var levels = window.luciNativeBeepVariantVolumes || [];
    if (!levels.length) return Math.max(0, Math.min(1, vol || 0));
    var target = Math.max(0, Math.min(1, vol || 0));
    var best = levels[0];
    var bestDist = Math.abs(target - best);
    for (var i = 1; i < levels.length; i++) {
      var d = Math.abs(target - levels[i]);
      if (d < bestDist) {
        best = levels[i];
        bestDist = d;
      }

    return best;
  }
  // Returns next available beep variant volume at or above target.
  function getRoundedUpBeepVariantVolume(vol) {
    var levels = window.luciNativeBeepVariantVolumes || [];
    var target = Math.max(0, Math.min(1, vol || 0));
    if (!levels.length) return target;
    for (var i = 0; i < levels.length; i++) {

  // Returns previous available beep variant volume at or below target.
  function getRoundedDownBeepVariantVolume(vol) {
    var levels = window.luciNativeBeepVariantVolumes || [];
    var target = Math.max(0, Math.min(1, vol || 0));
    if (!levels.length) return target;

    return levels[0];

  function getBeepVariantSuffixFromVolume(vol) {

    return String(whole) + '_5';

  // Parses suffix back to percent numeric (e.g. "0_5" -> 0.5, "12" -> 12).
  function parseBeepVariantSuffixPercent(s) {
    if (s == null) return NaN;
    return parseFloat(String(s).replace('_', '.'));
  }

  // Returns beep variant asset id.
  function getBeepVariantAssetId(vol) {
    return 'beep_v' + getBeepVariantSuffixFromVolume(vol);
  }
  // Stops native beep variants.
  function stopNativeBeepVariants(NA) {
    (window.luciNativeBeepVariantVolumes || []).forEach(function(v) {
      NA.stop({ assetId: getBeepVariantAssetId(v) }).catch(function() {});
    });
  }

  function ensureNativeBeepVariantsPreloaded() {
    var Cap = window.Capacitor;
    var NA = Cap && Cap.Plugins && Cap.Plugins.NativeAudio;
    if (!NA) return Promise.resolve(false);
    if (window.luciNativeBeepVariantsReady) return Promise.resolve(true);
    if (window.luciNativeBeepVariantsPromise) return window.luciNativeBeepVariantsPromise;
    var variants = window.luciNativeBeepVariantVolumes || [];
    window.luciNativeBeepVariantsPromise = Promise.all(variants.map(function(v) {
      var id = getBeepVariantAssetId(v);
      var path = 'public/sounds/' + id + '.wav';
      return NA.unload({ assetId: id }).catch(function() {})
        .then(function() {
          return NA.preload({
            assetId: id,
            assetPath: path,
            audioChannelNum: 1,
            isUrl: false
          });
        })
        .then(function() { return true; })
        .catch(function() { return false; });
    })).then(function(results) {
      window.luciNativeBeepVariantsPromise = null;
      window.luciNativeBeepVariantsReady = results.every(function(ok) { return !!ok; });
      return window.luciNativeBeepVariantsReady;
    }).catch(function() {
      window.luciNativeBeepVariantsPromise = null;
      window.luciNativeBeepVariantsReady = false;
      return false;
    });
    return window.luciNativeBeepVariantsPromise;
  }
  // Ensures native beep preloaded.

    var Cap = window.Capacitor;
    var NativeAudio = Cap && Cap.Plugins && Cap.Plugins.NativeAudio;
    if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform() || !NativeAudio || typeof NativeAudio.preload !== 'function') {
      return Promise.resolve(false);
    }
    if (window.luciNativeBeepPreloaded) return Promise.resolve(true);
    if (window.luciNativeAudioPreloadPromise) return window.luciNativeAudioPreloadPromise;
    // Primary base asset was historically beep.wav; now we also allow beep_v1.wav.
    var candidates = ['public/sounds/beep.wav', 'public/sounds/beep_v1.wav'];
    // Handles mark preloaded.
    function markPreloaded(srcLabel, assetPath, isUrl) {
      window.luciNativeBeepPreloaded = true;
      window.luciUseNativeAudio = true;
      window.luciNativeBeepAssetPath = assetPath || null;
      window.luciNativeBeepIsUrl = !!isUrl;
      window.luciNativeBeepVariantsReady = false;
      window.luciNativeAudioLastError = '';
      console.log('NativeAudio preloaded from:', srcLabel);
      return true;
    }
    // Handles remember audio error.
    function rememberAudioError(stage, err) {
      var msg = err && (err.message || err.error || err.localizedDescription || String(err)) || 'unknown';
      window.luciNativeAudioLastError = stage + ': ' + msg;
      console.warn('NativeAudio error [' + stage + ']:', err);
    }
    // Handles array buffer to base64.
    function arrayBufferToBase64(buffer) {
      var bytes = new Uint8Array(buffer);
      var chunkSize = 0x8000;
      var binary = '';
      for (var i = 0; i < bytes.length; i += chunkSize) {
        var chunk = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, chunk);
      }
      return btoa(binary);
    }
    // Handles preload from web asset to cache.
    function preloadFromWebAssetToCache() {
      var FS = Cap && Cap.Plugins && Cap.Plugins.Filesystem;
      if (!FS || typeof fetch !== 'function') return Promise.resolve(false);
      var cachePath = 'beep_from_www.wav';
      var dir = 1; // Directory.Cache
      return fetch('sounds/beep.wav')
        .then(function(resp) {
          if (!resp || !resp.ok) throw new Error('fetch sounds/beep.wav failed');
          return resp.arrayBuffer();
        })
        .then(function(buf) {
          var b64 = arrayBufferToBase64(buf);
          return FS.writeFile({ path: cachePath, data: b64, directory: dir });
        })
        .then(function() {
          return FS.getUri({ path: cachePath, directory: dir });
        })
        .then(function(res) {
          var uri = res && res.uri;
          if (!uri) throw new Error('Filesystem.getUri returned empty uri');
          if (NativeAudio.unload) {
            return NativeAudio.unload({ assetId: 'beep' }).catch(function() {}).then(function() { return uri; });
          }
          return uri;
        })
        .then(function(uri) {
          return NativeAudio.preload({ assetId: 'beep', assetPath: uri, audioChannelNum: 1, isUrl: true })
            .then(function() { return uri; });
        })
        .then(function(uri) { return markPreloaded('cache:file://beep_from_www.wav', uri, true); })
        .catch(function(e) {
          rememberAudioError('cache preload', e);
          return false;
        });
    }
    // Handles preload candidate.
    function preloadCandidate(idx) {
      if (idx >= candidates.length) return preloadFromWebAssetToCache();
      var p = candidates[idx];
      return NativeAudio.preload({ assetId: 'beep', assetPath: p, audioChannelNum: 1, isUrl: false })
        .then(function() { return markPreloaded(p, p, false); })
        .catch(function(e) {
          rememberAudioError('preload ' + p, e);
          return preloadCandidate(idx + 1);

    window.luciNativeAudioPreloadPromise = preloadCandidate(0).then(function(ok) {
      window.luciNativeAudioPreloadPromise = null;
      return ok;
    });
    return window.luciNativeAudioPreloadPromise;
  }
  // Ensures native long asset preloaded.
  function ensureNativeLongAssetPreloaded(assetId, filename, preloadVolume) {

    if (window.luciNativeLongAssetPromises[assetId]) return window.luciNativeLongAssetPromises[assetId];
    var candidates = ['public/sounds/' + filename];
    // Handles remember audio error.
    function rememberAudioError(stage, err) {
      var msg = err && (err.message || err.error || err.localizedDescription || String(err)) || 'unknown';
      window.luciNativeAudioLastError = stage + ': ' + msg;
      console.warn('NativeAudio error [' + stage + ']:', err);
    }
    // Handles mark preloaded.
    function markPreloaded(path, isUrl) {
      window.luciNativeLongAssetPaths[assetId] = path;
      window.luciNativeLongAssetIsUrl[assetId] = !!isUrl;
      return true;
    }
    // Handles array buffer to base64.
    function arrayBufferToBase64(buffer) {
      var bytes = new Uint8Array(buffer);
      var chunkSize = 0x8000;

    if (!window.luciUseNativeTorch) missing.push('flashlight');
    if (!window.luciUseNativeHaptics) missing.push('vibration');
    if (!window.luciUseNativeAudio || !window.luciNativeBeepPreloaded) missing.push('audio');
    if (!Cap.Plugins || !Cap.Plugins.Filesystem) missing.push('voice playback');
    if (missing.length) {
      showSnackbar('Unavailable on this device: ' + missing.join(', ') + '. Do not start the night until the LuciDreams app is working.');
    }
  }

  function setFeatureCheckResult(feature, status, detail) {
    if (!state.featureChecks) state.featureChecks = createInitialFeatureChecks();
    if (!state.featureCheckDetails) state.featureCheckDetails = createInitialFeatureCheckDetails();
    state.featureChecks[feature] = status;
    state.featureCheckDetails[feature] = detail || '';
    render();
  }

  function featureErrorText(err) {
    if (!err) return 'unknown error';
    if (typeof err === 'string') return err;
    return String(err.name || err.message || err.code || 'unknown error');
  }

  function readMicPermissionState() {
    if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve('unknown');
    return navigator.permissions.query({ name: 'microphone' })
      .then(function(status) { return status && status.state ? status.state : 'unknown'; })
      .catch(function() { return 'unknown'; });
  }

  function shouldRetryMicError(err) {
    var name = err && err.name ? String(err.name) : '';
    return name === 'NotReadableError' || name === 'AbortError' || name === 'NotAllowedError';
  }

  function acquireMicrophoneStream() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error('getUserMedia unavailable'));
    }
    var variants = [
      { audio: true },
      { audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
      { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }
    ];
    var retryDelaysMs = [0, 300, 900];
    function delay(ms) {
      return new Promise(function(resolve) { setTimeout(resolve, ms); });
    }
    function tryVariant(variantIdx, retryIdx, lastErr) {
      if (variantIdx >= variants.length) return Promise.reject(lastErr || new Error('Microphone unavailable'));
      var constraints = variants[variantIdx];
      var waitMs = retryDelaysMs[Math.min(retryIdx, retryDelaysMs.length - 1)];
      return delay(waitMs).then(function() {
        return navigator.mediaDevices.getUserMedia(constraints);
      }).catch(function(err) {
        if (shouldRetryMicError(err) && retryIdx < retryDelaysMs.length - 1) {
          return tryVariant(variantIdx, retryIdx + 1, err);
        }
        return tryVariant(variantIdx + 1, 0, err);
      });
    }
    return tryVariant(0, 0, null);
  }

  function isNativeAndroidPlatform() {
    var Cap = window.Capacitor;
    if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return false;
    if (typeof Cap.getPlatform === 'function') return Cap.getPlatform() === 'android';
    return false;
  }

  function getVoiceRecorderPlugin() {
    var Cap = window.Capacitor;
    if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return null;
    if (Cap.Plugins && Cap.Plugins.VoiceRecorder) return Cap.Plugins.VoiceRecorder;
    if (Cap && typeof Cap.registerPlugin === 'function') {
      try { return Cap.registerPlugin('VoiceRecorder'); } catch (e) { return null; }
    }
    return null;
  }

  function base64ToBlob(base64, mimeType) {
    var cleaned = String(base64 || '').replace(/\s/g, '');
    var binary = atob(cleaned);
    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mimeType || 'audio/aac' });
  }

  function getMicPlatformLabel() {
    var Cap = window.Capacitor;
    var p = (Cap && typeof Cap.getPlatform === 'function') ? Cap.getPlatform() : 'web';
    return String(p || 'unknown');
  }

  function buildMicDiagnostic(err, beforeState, afterState, stage) {
    var name = err && err.name ? String(err.name) : 'unknown';
    var message = err && err.message ? String(err.message) : '';
    var stageText = stage ? String(stage) : 'unknown';
    var p = getMicPlatformLabel();
    var bits = [
      'stage=' + stageText,
      'name=' + name,
      'before=' + String(beforeState || 'unknown'),
      'after=' + String(afterState || 'unknown'),
      'platform=' + p
    ];
    if (message) bits.push('msg=' + message);
    return bits.join(', ');
  }

  function captureAudioWithAndroidPicker() {
    return new Promise(function(resolve, reject) {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'audio/*';
      input.setAttribute('capture', 'microphone');
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      input.style.top = '-9999px';
      var cleaned = false;
      function cleanup() {
        if (cleaned) return;
        cleaned = true;
        try { document.body.removeChild(input); } catch (e) {}
      }
      input.onchange = function() {
        var f = input.files && input.files[0];
        cleanup();
        if (!f) {
          reject(new Error('No audio selected'));
          return;
        }
        resolve(f);
      };
      input.oncancel = function() {
        cleanup();
        reject(new Error('Audio capture canceled'));
      };
      document.body.appendChild(input);
      input.click();
    });
  }

  function getBlobDurationMs(blob) {
    return new Promise(function(resolve) {
      try {
        var url = URL.createObjectURL(blob);
        var a = new Audio();
        a.preload = 'metadata';
        var settled = false;
        function done(ms) {
          if (settled) return;
          settled = true;
          try { URL.revokeObjectURL(url); } catch (e) {}
          resolve(ms);
        }
        a.onloadedmetadata = function() {
          var d = Number(a.duration);
          if (!isFinite(d) || d <= 0) done(null);
          else done(Math.round(d * 1000));
        };
        a.onerror = function() { done(null); };
        a.src = url;
      } catch (e) {
        resolve(null);
      }
    });
  }

  function runMicrophoneFeatureCheck() {
    setFeatureCheckResult('microphone', 'running', 'Requesting permission...');
    if (USE_NATIVE_VOICE_RECORDER_PLUGIN && isNativeAndroidPlatform()) {
      var VR = getVoiceRecorderPlugin();
      if (!VR) {
        setFeatureCheckResult('microphone', 'fail', 'VoiceRecorder plugin unavailable on Android.');
        return Promise.resolve(false);
      }
      return VR.canDeviceVoiceRecord()
        .then(function(r) {
          if (!r || !r.value) throw new Error('DEVICE_CANNOT_VOICE_RECORD');
          return VR.requestAudioRecordingPermission();
        })
        .then(function(r) {
          if (!r || !r.value) throw new Error('MISSING_PERMISSION');
          return VR.getCurrentStatus ? VR.getCurrentStatus().catch(function() { return null; }) : null;
        })
        .then(function(statusRes) {
          if (statusRes && statusRes.status && statusRes.status !== 'NONE' && VR.stopRecording) {
            return VR.stopRecording().catch(function() { return null; });
          }
          return null;
        })
        .then(function() { return VR.startRecording(); })
        .then(function() { return new Promise(function(resolve) { setTimeout(resolve, 800); }); })
        .then(function() { return VR.stopRecording(); })
        .then(function(rec) {
          var value = rec && rec.value ? rec.value : rec;
          var dur = value && value.msDuration != null ? value.msDuration : null;
          var d = dur == null ? 'unknown' : String((dur / 1000).toFixed(1)) + 's';
          setFeatureCheckResult('microphone', 'pass', 'Native recorder OK (clip=' + d + ').');
          return true;
        })
        .catch(function(err) {
          var diag = buildMicDiagnostic(err, 'native_plugin', 'native_plugin', 'voice_recorder_test');
          window.luciLastMicDiag = diag;
          setFeatureCheckResult('microphone', 'fail', 'Mic failed: ' + diag);
          return false;
        });
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setFeatureCheckResult('microphone', 'fail', 'getUserMedia unavailable.');
      return Promise.resolve(false);
    }
    return readMicPermissionState().then(function(beforeState) {
      return acquireMicrophoneStream().then(function(stream) {
        try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {}
      }).then(function() {
        return readMicPermissionState().then(function(afterState) {
          setFeatureCheckResult('microphone', 'pass', 'Microphone permission granted (state: ' + afterState + ').');
          return true;
        });
      }).catch(function(err) {
        return readMicPermissionState().then(function(afterState) {
          var diag = buildMicDiagnostic(err, beforeState, afterState, 'getUserMedia');
          window.luciLastMicDiag = diag;
          setFeatureCheckResult(
            'microphone',
            'fail',
            'Mic failed: ' + diag
          );
          return false;
        });
      });
    });
  }

  function runVibrationFeatureCheck() {
    setFeatureCheckResult('vibration', 'running', 'Trying native vibration...');
    var Cap = window.Capacitor;
    var Haptics = Cap && Cap.Plugins && Cap.Plugins.Haptics;
    if (Haptics && typeof Haptics.vibrate === 'function') {
      return Haptics.vibrate({ duration: 250 })
        .then(function() {
          setFeatureCheckResult('vibration', 'pass', 'Native vibration worked.');
          return true;
        })
        .catch(function(err) {
          setFeatureCheckResult('vibration', 'fail', 'Native vibration failed: ' + featureErrorText(err));
          return false;
        });
    }
    if (navigator.vibrate) {
      navigator.vibrate(250);
      setFeatureCheckResult('vibration', 'pass', 'Browser vibration API triggered.');
      return Promise.resolve(true);
    }
    setFeatureCheckResult('vibration', 'fail', 'No vibration API available.');
    return Promise.resolve(false);
  }

  function runFlashlightFeatureCheck() {
    setFeatureCheckResult('flashlight', 'running', 'Trying native torch...');
    var Cap = window.Capacitor;
    var Torch = Cap && Cap.Plugins && Cap.Plugins.Torch;
    if (!Torch || typeof Torch.enable !== 'function' || typeof Torch.disable !== 'function') {
      setFeatureCheckResult('flashlight', 'fail', 'Torch plugin unavailable.');
      return Promise.resolve(false);
    }
    var availability = Torch.isAvailable && typeof Torch.isAvailable === 'function'
      ? Torch.isAvailable().catch(function() { return null; })
      : Promise.resolve(null);
    return availability.then(function(r) {
      if (r && r.available === false) {
        setFeatureCheckResult('flashlight', 'fail', 'Torch not available on this device.');
        return false;
      }
      return Torch.enable()
        .then(function() { return new Promise(function(resolve) { setTimeout(resolve, 700); }); })
        .then(function() { return Torch.disable(); })
        .then(function() {
          setFeatureCheckResult('flashlight', 'pass', 'Torch toggled successfully.');
          return true;
        })
        .catch(function(err) {
          setFeatureCheckResult('flashlight', 'fail', 'Torch failed: ' + featureErrorText(err));
          return false;
        });
    });
  }

  function runMotionFeatureCheck() {
    setFeatureCheckResult('motion', 'running', 'Requesting motion access...');
    return requestMotionPermission().then(function(result) {
      if (result !== 'granted') {
        setFeatureCheckResult('motion', 'fail', 'Motion permission denied.');
        return false;
      }
      if (!window.DeviceMotionEvent) {
        setFeatureCheckResult('motion', 'fail', 'DeviceMotionEvent unavailable.');
        return false;
      }
      return new Promise(function(resolve) {
        var done = false;
        function finish(ok, msg) {
          if (done) return;
          done = true;
          window.removeEventListener('devicemotion', onMotion);
          setFeatureCheckResult('motion', ok ? 'pass' : 'fail', msg);
          resolve(ok);
        }
        function onMotion(e) {
          var a = e && e.accelerationIncludingGravity;
          if (!a) return;
          var x = typeof a.x === 'number' ? Math.abs(a.x) : 0;
          var y = typeof a.y === 'number' ? Math.abs(a.y) : 0;
          var z = typeof a.z === 'number' ? Math.abs(a.z) : 0;
          if (x + y + z > 0.2) finish(true, 'Motion samples received.');
        }
        window.addEventListener('devicemotion', onMotion);
        setTimeout(function() {
          finish(false, 'No motion event detected. Move the phone and retry.');
        }, 3500);
      });
    }).catch(function(err) {
      setFeatureCheckResult('motion', 'fail', 'Motion check failed: ' + featureErrorText(err));
      return false;
    });
  }

  function runBeepV80FeatureCheck() {
    setFeatureCheckResult('beep_v80', 'running', 'Playing beep at 80%...');
    return new Promise(function(resolve) {
      var done = false;
      function finish(ok, msg) {
        if (done) return;
        done = true;
        setFeatureCheckResult('beep_v80', ok ? 'pass' : 'fail', msg);
        resolve(ok);
      }
      try {
        playBeep(0.8, 500, function() { finish(true, 'Played beep variant near v80.'); });
        setTimeout(function() {
          finish(false, 'No playback callback received (check native audio setup).');
        }, 2500);
      } catch (err) {
        finish(false, 'Beep test failed: ' + featureErrorText(err));
      }
    });
  }

  function runAllFeatureChecks() {
    return runMicrophoneFeatureCheck()
      .then(function() { return runVibrationFeatureCheck(); })
      .then(function() { return runFlashlightFeatureCheck(); })
      .then(function() { return runMotionFeatureCheck(); })
      .then(function() { return runBeepV80FeatureCheck(); });
  }

  // Handles process motion per second.
  function processMotionPerSecond(motionForSecond) {
    state.epochs++;
    state.secondsRecorded++;

    state.totalHistory.push(motionForSecond >= SIG_MOTION ? 1 : 0);
    if (state.totalHistory.length > BUFFER_SIZE) state.totalHistory.shift();
    const currentMotionSum = state.totalHistory.reduce(function(a, b) { return a + b; }, 0);
    state.summedMotion.push(currentMotionSum);
    state.motionHistory.push(motionForSecond);
    if (state.summedMotion.length > BUFFER_SIZE) state.summedMotion.shift();
    if (state.motionHistory.length > BUFFER_SIZE) state.motionHistory.shift();
    state.rawMotionSeries.push(motionForSecond);

    if (state.secondsRecorded <= REM_GATE_SECONDS) state.baselineMotionSum += motionForSecond;

    state.remSmoothWindowValues.push(motionForSecond);
    state.remSmoothWindowSum += motionForSecond;
    if (state.remSmoothWindowValues.length > REM_SMOOTH_WINDOW_SEC) {
      state.remSmoothWindowSum -= state.remSmoothWindowValues.shift();
    }
    if (state.remSmoothWindowValues.length >= REM_SMOOTH_WINDOW_SEC) {
      state.smoothedMotionCurrent = state.remSmoothWindowSum / state.remSmoothWindowValues.length;
      // Populate reference series all night so the percentile cutoff evolves over time.
      state.smoothedMotionSeries.push(state.smoothedMotionCurrent);
      var dynamicCutoff = getStillnessCutoffFromSeries(state.smoothedMotionSeries);
      state.motion80pctCutoffCurrent = dynamicCutoff;
      if (dynamicCutoff != null) state.motion80pctCutoffSeries.push(dynamicCutoff);
    } else {
      state.smoothedMotionCurrent = null;
      state.motion80pctCutoffCurrent = null;
    }

    if (state.secondsRecorded === REM_GATE_SECONDS && state.smoothedMotionSeries.length > 0) {
      var seriesAtGate = state.smoothedMotionSeries;
      var meanAtGate = seriesAtGate.reduce(function(a, b) { return a + b; }, 0) / seriesAtGate.length;
      console.log('REM gate (4h): REM logic enabled. n=', seriesAtGate.length, 'mean=', meanAtGate, '(stillness compares current rolling value vs evolving current-series distribution at', REM_STILLNESS_PERCENT_OF_SERIES_MEAN * 100, '%)');
    }

    const afterGate = (
      state.secondsRecorded > REM_GATE_SECONDS &&
      state.smoothedMotionSeries.length > 0 &&
      state.smoothedMotionCurrent != null
    );

    if (afterGate) {
      var seriesAll = state.smoothedMotionSeries;
      var rawSeriesAll = state.rawMotionSeries;
      var smoothedMotion = state.smoothedMotionCurrent;
      var seriesMean = seriesAll.reduce(function(a, b) { return a + b; }, 0) / seriesAll.length;
      var movementNoiseFloor = seriesMean * REM_STILLNESS_PERCENT_OF_SERIES_MEAN;
      var belowCount = seriesAll.reduce(function(count, v) { return count + (smoothedMotion < v ? 1 : 0); }, 0);
      var isStillSmoothed = (belowCount / seriesAll.length) >= REM_STILLNESS_PERCENT_OF_SERIES_MEAN;
      var rawAboveCount = rawSeriesAll.reduce(function(count, v) { return count + (motionForSecond > v ? 1 : 0); }, 0);
      var isRawAbove80PercentOfSeries = rawSeriesAll.length > 0 && (rawAboveCount / rawSeriesAll.length) >= REM_STILLNESS_PERCENT_OF_SERIES_MEAN;
      if (state.inRemEpisode) {
        state.remEpisodeRawMotionValues.push(motionForSecond);
      }

      // Finalizes current rem episode.
      function finalizeCurrentRemEpisode() {
        if (!state.inRemEpisode) return;
        var dur = state.secondsRecorded - state.remEpisodeStartSeconds;
        var trains = state.currentEpisodeTrains.slice();
        if (trains.length) {
          var last = trains[trains.length - 1];
          if (last.disruptive && last.end_epoch_sec == null) {
            last.end_epoch_sec = state.secondsRecorded;
            last.duration_sec = state.secondsRecorded - last.disruptive.start_epoch_sec;
          }
        }
        state.remEpisodes.push({
          start_epoch_sec: state.remEpisodeStartSeconds,
          duration_sec: dur,
          device_time_start: state.remEpisodeStartTime,
          trains: trains
        });
        state.inRemEpisode = false;
        state.consecutiveRemSeconds = 0;
        state.remEntryStableStartEpoch = null;
        state.currentRemEpisodeEntryThreshold = null;
        state.trainPhase = null;
        state.trainStartEpoch = null;
        state.nextTrainInductionCap = null;
        state.lastInductionPlayEpoch = null;
        state.lastInductionCueBaselineRawAvg = null;
        state.lastInductionCuePostRawValues = [];
        state.lastDisruptiveCueEpoch = null;
        state.lastDisruptiveCueBaselineRawQ = null;
        state.lastDisruptiveCuePostRawValues = [];
        state.remEpisodeRawMotionValues = [];
        state.disruptiveRampActive = false;
        state.disruptiveRampFoundVolume = null;
        state.disruptiveRampCandidateVolume = 0;
        state.disruptiveRampLastCueEpoch = null;
        state.disruptiveRampConsecutiveAbove = 0;
        state.disruptiveWaveRampActive = false;
        state.disruptiveWaveCurrentVolume = 0;
        state.disruptiveWaveArousalVolume = null;
        state.disruptiveWaveTargetVolume = 1;
        clearDisruptiveTimeouts();
        if (nextTrainTimeoutId) { clearTimeout(nextTrainTimeoutId); nextTrainTimeoutId = null; }
        if (state.soundRunning) stopSound();
        cancelScheduledCue();
      }

      if (isRawAbove80PercentOfSeries) state.consecutive_seconds_above_threshold++;
      else state.consecutive_seconds_above_threshold = 0;

      // Arousal check in disruptive phase:
      // if post-cue raw metric (single value when window=1s, otherwise mean) > REM-local raw percentile baseline.
      if (state.trainPhase === 'disruptive' && state.lastDisruptiveCueEpoch != null) {
        var secSinceDisruptiveCue = state.secondsRecorded - state.lastDisruptiveCueEpoch;
        if (secSinceDisruptiveCue > 0 && secSinceDisruptiveCue <= AROUSAL_POST_CUE_WINDOW_SEC) {
          state.lastDisruptiveCuePostRawValues.push(motionForSecond);
        }
        if (secSinceDisruptiveCue === AROUSAL_POST_CUE_WINDOW_SEC && state.lastDisruptiveCueBaselineRawQ != null && state.lastDisruptiveCuePostRawValues.length >= AROUSAL_POST_CUE_WINDOW_SEC) {
          var disruptivePostMetric = state.lastDisruptiveCuePostRawValues.reduce(function(a, b) { return a + b; }, 0) / state.lastDisruptiveCuePostRawValues.length;
          if (disruptivePostMetric > state.lastDisruptiveCueBaselineRawQ) {
            if (state.tonight_condition === 1 && state.disruptiveRampActive && state.disruptiveRampFoundVolume == null) {
              state.disruptiveRampFoundVolume = state.disruptiveRampCandidateVolume;
              state.disruptiveRampActive = false;
              stopCurrentBeepPlaybackNow();
              state.soundRunning = false;
              console.log('Disruptive ramp arousal volume set (post-cue raw > REM raw q90):', state.disruptiveRampFoundVolume, 'postCueMetric=', disruptivePostMetric, 'baselineQ=', state.lastDisruptiveCueBaselineRawQ);
            }
            if ((state.tonight_condition === 6 || state.tonight_condition === 7) && state.disruptiveWaveArousalVolume == null) {
              state.disruptiveWaveArousalVolume = state.disruptiveWaveCurrentVolume;
              state.disruptiveWaveTargetVolume = Math.max(0, Math.min(1, state.disruptiveWaveCurrentVolume * 0.95));
              state.disruptiveWaveCurrentVolume = state.disruptiveWaveTargetVolume;
              setDisruptiveWaveVolume(state.disruptiveWaveTargetVolume);
              state.disruptiveWaveRampActive = false;
              var trainW = state.currentEpisodeTrains.length ? state.currentEpisodeTrains[state.currentEpisodeTrains.length - 1] : null;
              if (trainW && trainW.disruptive && trainW.disruptive.params) {
                trainW.disruptive.params.found_arousal_volume = state.disruptiveWaveArousalVolume;
                trainW.disruptive.params.post_arousal_target_volume = state.disruptiveWaveTargetVolume;
              }
              console.log('Disruptive wave arousal volume set (post-cue raw > REM raw q90):', state.disruptiveWaveArousalVolume, 'target=', state.disruptiveWaveTargetVolume, 'postCueMetric=', disruptivePostMetric, 'baselineQ=', state.lastDisruptiveCueBaselineRawQ);
            }
          }
        }
      }

      // Arousal check in induction phase:
      // if post-cue raw metric (single value when window=1s, otherwise mean) > REM-local raw percentile baseline.
      if (state.trainPhase === 'induction' && state.lastInductionPlayEpoch != null) {
        var secSinceCue = state.secondsRecorded - state.lastInductionPlayEpoch;
        if (secSinceCue > 0 && secSinceCue <= AROUSAL_POST_CUE_WINDOW_SEC) {
          state.lastInductionCuePostRawValues.push(motionForSecond);
        }
        if (secSinceCue === AROUSAL_POST_CUE_WINDOW_SEC && state.lastInductionCueBaselineRawAvg != null && state.lastInductionCuePostRawValues.length >= AROUSAL_POST_CUE_WINDOW_SEC) {
          var inductionPostMetric = state.lastInductionCuePostRawValues.reduce(function(a, b) { return a + b; }, 0) / state.lastInductionCuePostRawValues.length;
          if (inductionPostMetric > state.lastInductionCueBaselineRawAvg) {
            var train = state.currentEpisodeTrains.length ? state.currentEpisodeTrains[state.currentEpisodeTrains.length - 1] : null;
            if (train && train.induction.cues.length) {
              train.induction.cues[train.induction.cues.length - 1].arousal_detected = true;
              train.induction.arousal_threshold = state.inductionVolume;
              state.arousal_threshold = state.inductionVolume;
              // Next train in this REM episode: cap induction at 95% of the arousal volume.
              var nextCap = getRoundedDownBeepVariantVolume(Math.min(1, state.inductionVolume * 0.95));
              state.nextTrainInductionCap = Math.max(getInductionStartVolume(), nextCap);
              saveArousalThreshold(state.arousal_threshold);
              console.log('Arousal threshold set (post-cue raw > REM raw q90):', state.arousal_threshold, 'postCueMetric=', inductionPostMetric, 'baselineQ=', state.lastInductionCueBaselineRawAvg);
            }
            endTrain(true);
          }
        }
      }

      if (!state.inRemEpisode) {
        if (!isStillSmoothed) {
          state.consecutiveRemSeconds = 0;
        } else {
        var refractoryOk = state.lastCueEpoch === 0 || (state.secondsRecorded - state.lastCueEpoch >= REFRACTORY_PERIOD_SEC);
        var readyForFirstTrain = !state.inRemEpisode;

        if (readyForFirstTrain && state.trainPhase === null && refractoryOk && !state.soundRunning) {
          state.remEpisodeStartSeconds = state.secondsRecorded;
          state.remEpisodeStartTime = new Date().toISOString();
          state.remEpisodeRawMotionValues = [];
          state.currentRemEpisodeEntryThreshold = movementNoiseFloor;
          state.inRemEpisode = true;
          state.remEntryStableStartEpoch = state.secondsRecorded;
          state.currentEpisodeTrains = [];
          state.nextTrainInductionCap = null;
          state.lastCueEpoch = 0;
        }
        }
      } else {
        if (!isStillSmoothed) {
          if (state.trainPhase !== 'disruptive') {
            finalizeCurrentRemEpisode();
          }
        } else {
          var isFirstTrainPending = (state.currentEpisodeTrains || []).length === 0;
          var remStableForSec = state.remEntryStableStartEpoch == null ? 0 : (state.secondsRecorded - state.remEntryStableStartEpoch);
          if (isFirstTrainPending && state.trainPhase === null && !state.soundRunning && remStableForSec >= REM_ENTRY_HOLD_SEC) {
            if (state.tonight_condition !== 0 && !hasReachedNightTrainCap() && !hasReachedEpisodeTrainCap()) startTrain();
          }
          if (state.trainPhase === 'induction' && !state.soundRunning && state.lastInductionPlayEpoch != null) {
            var elapsed = state.secondsRecorded - state.lastInductionPlayEpoch;
            if (elapsed >= AROUSAL_CHECK_WINDOW_SEC) {

              if (train2 && train2.induction.arousal_threshold == null) {

                if (nextVol <= state.inductionCap + 0.001) {

                }
              }
            }
          }
        }
      }
    } else {
      // Before 4h gate or before the rolling window is available: no REM / trains from this logic.
      state.consecutive_seconds_above_threshold = 0;
      state.inRemEpisode = false;
      state.consecutiveRemSeconds = 0;
      state.remEntryStableStartEpoch = null;
      state.currentRemEpisodeEntryThreshold = null;
      state.trainPhase = null;
      state.trainStartEpoch = null;
      state.lastInductionPlayEpoch = null;
      state.lastInductionCueBaselineRawAvg = null;
      state.lastInductionCuePostRawValues = [];
      state.lastDisruptiveCueEpoch = null;
      state.lastDisruptiveCueBaselineRawQ = null;
      state.lastDisruptiveCuePostRawValues = [];
      state.remEpisodeRawMotionValues = [];
      state.disruptiveRampActive = false;
      state.disruptiveRampFoundVolume = null;
      state.disruptiveRampCandidateVolume = 0;
      state.disruptiveRampLastCueEpoch = null;
      state.disruptiveRampConsecutiveAbove = 0;
      state.disruptiveWaveRampActive = false;
      state.disruptiveWaveCurrentVolume = 0;

      if (nextTrainTimeoutId) { clearTimeout(nextTrainTimeoutId); nextTrainTimeoutId = null; }
      cancelScheduledCue();
      if (state.soundRunning) stopSound();

  }

  // Handles request motion permission.
  function requestMotionPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      return DeviceMotionEvent.requestPermission().then(function(perm) {
        return perm === 'granted' ? 'granted' : 'denied';
      }).catch(function() { return 'denied'; });
    }
    return Promise.resolve('granted');
  }

  // Handles enable no sleep.
  function enableNoSleep() {
    if (!state.noSleep) state.noSleep = new NoSleep();
    return state.noSleep.enable ? state.noSleep.enable() : Promise.resolve();
  }

  // Handles disable no sleep.
  function disableNoSleep() {
    if (state.noSleep && state.noSleep.disable) state.noSleep.disable();
  }

  // Handles start sequence.
  function handleStartSequence() {
    function applyBaselineAndProceed(savedBaseline) {
      var baseline = (savedBaseline != null && savedBaseline > 0) ? savedBaseline : 0.5;
      baseline = Math.max(0.01, Math.min(1, baseline));
      state.userMinVolume = baseline;
      state.titrationCeiling = Math.min(1, baseline + USER_MIN_VOLUME_CEILING_DELTA);
      state.finalSleepVolume = baseline;
      state.baselineSliderVolume = baseline;
      saveBaselineVolume(state.pid, baseline);
      startRecordingMotion('training');
    }
    requestMotionPermission().then(function(result) {
      if (result === 'granted') enableNoSleep();
      setMotionGranted(state.pid);
      applyBaselineAndProceed(loadBaselineVolume(state.pid));
    }).catch(function() {
      setMotionGranted(state.pid);
      applyBaselineAndProceed(loadBaselineVolume(state.pid));
    });
  }

  // Sets baseline.
  function setBaseline() {
    var v = Math.max(0.01, Math.min(1, parseFloat(state.baselineSliderVolume) || 0.1));
    state.userMinVolume = v;
    state.titrationCeiling = Math.min(1, v + USER_MIN_VOLUME_CEILING_DELTA);
    state.finalSleepVolume = v;
    saveBaselineVolume(state.pid, v);
    state.appStep = 4;
    render();
  }

  // Handles activate motion and start sleep.
  function activateMotionAndStartSleep() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission().then(function(result) {
        if (result === 'granted') {
          enableNoSleep();
          startRecordingMotion();
        } else {
          showSnackbar('Motion detection permission is required to proceed.');
        }
      }).catch(function() {
        showSnackbar('Motion permission is required.');
      });
    } else {
      enableNoSleep();
      startRecordingMotion();
    }
  }

  // Starts recording motion.
  function startRecordingMotion(targetStep) {
    // Condition/night should be assigned once during participant setup, not again here.
    if (state.pid && state.tonight_condition == null) ensureConditionForTonight(state.pid);
    // Prime native audio, vibration on this user gesture before timer-fired cues
    primeAudioForSleep();
    primeVibrationForSleep();
    primeLightForSleep();
    enableNoSleep();
    state.trainingComplete = false;
    state.trainingActive = false;
    state.trainingSkipped = false;
    state.trainingRemainingSec = Math.floor(TRAINING_DURATION_MS / 1000);
    state.appStep = targetStep || 5;
    state.motionThisSecond = 0;
    state.motionSamplesForBackend = [];
    state.motionDeltaOnlySamplesForBackend = [];
    state.motionDeltaPlusTilt15SamplesForBackend = [];
    state.secondsRecorded = 0;
    state.smoothedMotionSeries = [];
    state.rawMotionSeries = [];
    state.smoothedMotionCurrent = null;
    state.motion80pctCutoffSeries = [];
    state.motion80pctCutoffCurrent = null;
    state.remSmoothWindowValues = [];
    state.remSmoothWindowSum = 0;
    state.baselineMotionSum = 0;
    state.oldValuesSet = false;
    state.consecutiveRemSeconds = 0;
    state.remEpisodes = [];
    state.rawSensorSamples = [];
    state.inRemEpisode = false;
    state.currentRemEpisodeEntryThreshold = null;
    state.lastCueEpoch = 0;
      state.consecutive_seconds_above_threshold = 0;
      state.trainPhase = null;
    state.trainStartEpoch = null;
    state.lastInductionPlayEpoch = null;
    state.lastInductionCueBaselineRawAvg = null;
    state.lastInductionCuePostRawValues = [];
    state.lastDisruptiveCueEpoch = null;
    state.lastDisruptiveCueBaselineRawQ = null;
    state.lastDisruptiveCuePostRawValues = [];
    state.remEpisodeRawMotionValues = [];
    state.currentEpisodeTrains = [];
    state.disruptiveTimeouts = [];
    state.inductionVolume = getInductionStartVolume();
    state.inductionCap = 1;
    state.nextTrainInductionCap = null;
    var savedThreshold = loadArousalThreshold();
    state.arousal_threshold = savedThreshold;

    // Handles on accel.
    function onAccel(e) {
      const x = e.accelerationIncludingGravity.x;
      const y = e.accelerationIncludingGravity.y;
      const z = e.accelerationIncludingGravity.z;
      state.lastRawX = x; state.lastRawY = y; state.lastRawZ = z;
      const magnitude = Math.sqrt(x*x + y*y + z*z);
      state.lastMagnitude = magnitude;
      if (!state.oldValuesSet) {
        state.oldX = x; state.oldY = y; state.oldZ = z;
        state.oldValuesSet = true;
        return;
      }
      const diff = Math.abs(x - state.oldX) + Math.abs(y - state.oldY) + Math.abs(z - state.oldZ);
      state.motionThisSecond += diff;
      state.oldX = x; state.oldY = y; state.oldZ = z;
    }

    if (window.DeviceMotionEvent) {
      state.accelHandler = onAccel;
      window.addEventListener('devicemotion', onAccel);
    }

    state.motionSampleTimer = setInterval(function() {
      let deltaOnlyMotion = state.motionThisSecond;
      state.motionThisSecond = 0;
      let motionFromTilt = state.lastMagnitude < 2 ? state.lastMagnitude : Math.abs(state.lastMagnitude - 9.81);
      let motionWithTilt15 = deltaOnlyMotion + (ANDROID_TILT_WEIGHT * motionFromTilt);
      let legacyMotion = deltaOnlyMotion + motionFromTilt;
      let platform = getCapacitorPlatform();
      let remMotion = (platform === 'android') ? deltaOnlyMotion : legacyMotion;
      if (platform !== 'android') state.motionDeltaOnlySamplesForBackend.push(deltaOnlyMotion);
      if (platform === 'android') state.motionDeltaPlusTilt15SamplesForBackend.push(motionWithTilt15);
      state.motionSamplesForBackend.push(remMotion);
      processMotionPerSecond(remMotion);
    }, 1000);

    state.sleepStartTime = Date.now();
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(function() {
      if (state.appStep !== 5 && state.appStep !== 'training') return;
      render();
    }, 1000);
    if (state.localBackupTimerId) {
      clearInterval(state.localBackupTimerId);
      state.localBackupTimerId = null;
    }
    saveLocalSessionBackup('sleep_start');
    state.localBackupTimerId = setInterval(function() {
      if (state.appStep !== 5 && state.appStep !== 'training') return;
      saveLocalSessionBackup('minute_checkpoint');
    }, LOCAL_SESSION_BACKUP_INTERVAL_MS);
    render();
  }

  // Stops sound.
  function stopSound() {
    cancelScheduledCue();
    stopDisruptiveWaveNoise();
    if (state.soundRunning) {
      state.soundRunning = false;
    }
    render();
  }

  // Stops currently playing beep assets immediately.
  function stopCurrentBeepPlaybackNow() {
    var Cap = window.Capacitor;
    var NA = Cap && Cap.Plugins && Cap.Plugins.NativeAudio;
    if (!NA) return;
    stopNativeBeepVariants(NA);
    NA.stop({ assetId: 'beep' }).catch(function() {});
  }

  // Computes motion averages.
  function computeMotionAverages() {
    var motion = state.motionSamplesForBackend;
    var remEpisodes = state.remEpisodes;
    var baseline_avg = null;
    var rem_episode_averages = [];
    var intermediate_avg = null;
    var gate = REM_GATE_SECONDS;
    if (motion.length >= gate) {
      var sum = 0;
      for (var i = 0; i < gate; i++) sum += motion[i];
      baseline_avg = sum / gate;
    }
    for (var e = 0; e < remEpisodes.length; e++) {
      var start = remEpisodes[e].start_epoch_sec;
      var dur = remEpisodes[e].duration_sec;
      if (start + dur <= motion.length && dur > 0) {
        sum = 0;
        for (var j = start; j < start + dur && j < motion.length; j++) sum += motion[j];
        rem_episode_averages.push({
          start_epoch_sec: start,
          duration_sec: dur,
          device_time_start: remEpisodes[e].device_time_start,
          avg_motion: sum / dur
        });
      }
    }
    if (motion.length > gate) {
      var inRem = {};
      for (var e = 0; e < remEpisodes.length; e++) {
        var start = remEpisodes[e].start_epoch_sec;
        var dur = remEpisodes[e].duration_sec;
        for (var k = 0; k < dur && start + k < motion.length; k++) inRem[start + k] = true;
      }
      sum = 0;
      var count = 0;
      for (var i = gate; i < motion.length; i++) {
        if (!inRem[i]) { sum += motion[i]; count++; }
      }
      if (count > 0) intermediate_avg = sum / count;
    }
    return { baseline_avg: baseline_avg, rem_episode_averages: rem_episode_averages, intermediate_avg: intermediate_avg };
  }

  // Handles episode motion avg.
  function episodeMotionAvg(startSec, durationSec) {
    var motion = state.motionSamplesForBackend;
    if (startSec + durationSec > motion.length || durationSec <= 0) return null;
    var sum = 0;
    for (var i = 0; i < durationSec; i++) sum += motion[startSec + i] || 0;
    return sum / durationSec;
  }

  /** Native bridge status as object (Firestore); Qualtrics uses JSON string of same shape. */
  function buildNativeApiStatusObject() {
    var Cap = window.Capacitor;
    var native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
    return {
      is_native: native,
      torch: !!window.luciUseNativeTorch,
      haptics: !!window.luciUseNativeHaptics,
      native_audio: !!window.luciUseNativeAudio
    };
  }

  /**
   * Aggregates from finalized rem_periods[] — same numbers/text as Qualtrics embedded fields.
   * Flat `trains` entries include episode_index / train_index for joins with rem_periods.
   */
  function computeStimulationRollups(rem_periods) {
    var periods = rem_periods || [];
    var induction_cues = [];
    var trains_flat = [];
    var train_starts = [];
    var total_train_count = 0;
    var arousal_reached_count = 0;
    var induction_highest_volume = null;
    var ei, tj, ck, ep, trs, tr, d, cues, c;

    for (ei = 0; ei < periods.length; ei++) {
      ep = periods[ei];
      trs = ep.trains || [];
      total_train_count += countDeliveredTrains(trs);
      for (tj = 0; tj < trs.length; tj++) {
        tr = trs[tj];
        var flatTrain = {
          episode_index: ei,
          train_index: tj,
          end_epoch_sec: tr.end_epoch_sec != null ? tr.end_epoch_sec : null,
          disruptive: tr.disruptive || {},
          induction: tr.induction || { cues: [], arousal_threshold: null }
        };
        flatTrain.duration_sec = tr.duration_sec != null ? tr.duration_sec : null;
        trains_flat.push(flatTrain);
        d = tr.disruptive || {};
        if (d.device_time_start) train_starts.push(d.device_time_start);
        cues = (tr.induction && tr.induction.cues) || [];
        for (ck = 0; ck < cues.length; ck++) {
          c = cues[ck];
          induction_cues.push({
            episode_index: ei,
            train_index: tj,
            volume: c.volume,
            epoch_sec: c.epoch_sec,
            took_place: c.took_place,
            arousal_detected: c.arousal_detected
          });
          if (c.arousal_detected) arousal_reached_count++;
          if (c.volume != null && (induction_highest_volume === null || c.volume > induction_highest_volume)) {
            induction_highest_volume = c.volume;
          }
        }
      }
    }
    train_starts.sort();

    var rem_motion_weighted = 0;
    var rem_motion_dur = 0;
    for (ei = 0; ei < periods.length; ei++) {
      var ma = periods[ei].motion_avg;
      var du = periods[ei].duration_sec || 0;
      if (ma != null && du > 0) {
        rem_motion_weighted += ma * du;
        rem_motion_dur += du;
      }
    }
    var rem_motion_avg = rem_motion_dur > 0 ? rem_motion_weighted / rem_motion_dur : null;

    return {
      induction_cues: induction_cues,
      trains: trains_flat,
      train_starts: train_starts,
      total_train_count: total_train_count,
      arousal_reached_count: arousal_reached_count,
      induction_highest_volume: induction_highest_volume,
      rem_motion_avg: rem_motion_avg,
      train_cap_reached_count: total_train_count >= NIGHT_MAX_TRAINS ? 1 : 0,
      first_train_start_time: train_starts.length ? train_starts[0] : null,
      last_train_start_time: train_starts.length ? train_starts[train_starts.length - 1] : null
    };
  }

  // Returns percentile cutoff from series (nearest-rank style via floor index).
  function getPercentileCutoffFromSeries(series, percentile01) {
    var s = series || [];
    if (!s.length) return null;
    var sorted = s.slice().sort(function(a, b) { return a - b; });
    var p = Math.max(0, Math.min(1, percentile01));
    var idx = Math.max(0, Math.min(sorted.length - 1, Math.floor(p * (sorted.length - 1))));
    return sorted[idx];
  }

  // Returns stillness cutoff from series.
  function getStillnessCutoffFromSeries(series) {
    var s = series || [];
    if (!s.length) return null;
    var sorted = s.slice().sort(function(a, b) { return a - b; });
    var idx = Math.max(0, Math.min(sorted.length - 1, Math.floor((1 - REM_STILLNESS_PERCENT_OF_SERIES_MEAN) * (sorted.length - 1))));
    return sorted[idx];
  }

  // Returns current series stillness cutoff.
  function getCurrentSeriesStillnessCutoff() {
    var s = state.smoothedMotionSeries || [];
    return getStillnessCutoffFromSeries(s);
  }

  // Compacts numeric series for storage by rounding to fixed decimals.
  function compactNumericSeries(series, decimals) {
    var d = Math.max(0, Math.min(6, parseInt(decimals, 10) || 0));
    var out = [];
    (series || []).forEach(function(v) {
      var n = Number(v);
      if (!isFinite(n)) return;
      out.push(Number(n.toFixed(d)));
    });
    return out;
  }

  /**
   * Returns { firestoreDoc, surveyData }. Firestore includes full rem_periods (episodes + nested trains).
   * surveyData adds flat trains + motionAvgs for Qualtrics URL (motion breakdowns not stored in Firestore).
   */
  function buildSleepSessionPayload(activeMode) {
    var rawEpisodes = state.remEpisodes.slice();
    var totalRemMinutes = rawEpisodes.reduce(function(sum, ep) { return sum + Math.round((ep.duration_sec || 0) / 60); }, 0);
    var motionAvgs = computeMotionAverages();
    var cond = state.tonight_condition != null ? state.tonight_condition : null;
    var soundArousal = state.arousal_threshold != null && state.arousal_threshold > 0 ? state.arousal_threshold : (loadArousalThreshold() || null);
    var deviceTime = new Date().toISOString();
    var nightStartIso = state.sleepStartTime ? new Date(state.sleepStartTime).toISOString() : null;
    var nightNumStr = getNightNumberForSurvey(state.pid);
    var night_number = nightNumStr === '' ? null : Number(nightNumStr);

    var rem_periods = rawEpisodes.map(function(ep) {
      var durSec = ep.duration_sec || 0;
      var trains = (ep.trains || []).map(function(t) {
        var d = t.disruptive || {};
        var out = {
          end_epoch_sec: t.end_epoch_sec != null ? t.end_epoch_sec : null,
          disruptive: {
            start_epoch_sec: d.start_epoch_sec,
            device_time_start: d.device_time_start || null,
            took_place: !!d.took_place,
            params: d.params || {}
          },
          induction: {
            cues: (t.induction.cues || []).map(function(c) {
              return {
                volume: c.volume,
                epoch_sec: c.epoch_sec,
                device_time_start: c.device_time_start || null,
                took_place: c.took_place,
                arousal_detected: c.arousal_detected
              };
            }),
            arousal_threshold: t.induction.arousal_threshold
          }
        };
        if (d.type !== 3) out.duration_sec = t.duration_sec != null ? t.duration_sec : null;
        return out;
      });
      return {
        start_epoch_sec: ep.start_epoch_sec,
        duration_sec: durSec,
        device_time_start: ep.device_time_start || null,
        motion_avg: episodeMotionAvg(ep.start_epoch_sec, durSec),
        trains: trains
      };
    });

    var roll = computeStimulationRollups(rem_periods);
    var currentSeriesStillnessCutoff = getCurrentSeriesStillnessCutoff();
    var platform = getCapacitorPlatform();
    // Persist per-second motion amount (not 80th-percentile cutoff series).
    var motionSeries = compactNumericSeries((state.motionSamplesForBackend || []).slice(), 3);
    var motionDeltaOnlySeries = (platform !== 'android')
      ? compactNumericSeries((state.motionDeltaOnlySamplesForBackend || []).slice(), 3)
      : [];
    var motionDeltaPlusTilt15Series = (platform === 'android')
      ? compactNumericSeries((state.motionDeltaPlusTilt15SamplesForBackend || []).slice(), 3)
      : [];
    // Also persist smoothed rolling-motion series used by REM logic.
    var smoothedMotionSeries = compactNumericSeries((state.smoothedMotionSeries || []).slice(), 3);

    var general = {
      session_type: activeMode,
      condition: cond,
      device_time_end: deviceTime,
      device_time_start: nightStartIso,
      night_number: night_number,
      epochs_count: state.epochs,
      // Kept for backward compatibility with older exports/analytics expecting this key.
      motion_80pct_cutoff_first_4h: currentSeriesStillnessCutoff,
      rem_minutes: totalRemMinutes,
      rem_motion_avg: roll.rem_motion_avg,
      rem_episode_count: rem_periods.length,
      arousal_threshold: soundArousal,
      arousal_reached_count: roll.arousal_reached_count,
      induction_highest_volume: roll.induction_highest_volume,
      train_cap_reached_count: roll.train_cap_reached_count,
      first_train_start_time: roll.first_train_start_time,
      last_train_start_time: roll.last_train_start_time,
      native_api_status: buildNativeApiStatusObject(),
      night_max_trains: NIGHT_MAX_TRAINS,
      total_trains_delivered: roll.total_train_count,
      app_version: 'luci2026'
    };

    var firestoreDoc = {
      participant_id: state.pid,
      general: general,
      rem_periods_json: JSON.stringify(rem_periods),
      rem_periods_count: rem_periods.length,
      motion_per_second_series_json: JSON.stringify(motionSeries),
      motion_per_second_series_len: motionSeries.length,
      smoothed_motion_series_json: JSON.stringify(smoothedMotionSeries),
      smoothed_motion_series_len: smoothedMotionSeries.length
    };
    if (motionDeltaOnlySeries.length > 0) {
      firestoreDoc.motion_delta_only_series_json = JSON.stringify(motionDeltaOnlySeries);
      firestoreDoc.motion_delta_only_series_len = motionDeltaOnlySeries.length;
    }
    if (motionDeltaPlusTilt15Series.length > 0) {
      firestoreDoc.motion_delta_plus_tilt15_series_json = JSON.stringify(motionDeltaPlusTilt15Series);
      firestoreDoc.motion_delta_plus_tilt15_series_len = motionDeltaPlusTilt15Series.length;
    }

    return {
      firestoreDoc: firestoreDoc,
      surveyData: {
        rem_periods: rem_periods,
        trains: roll.trains,
        motionAvgs: motionAvgs
      }
    };
  }

  /** Night index for this participant (1-based), date-stable by local calendar day. */
  function getNightNumberForSurvey(pid) {
    try {
      var raw = localStorage.getItem(getConditionStateKey(pid));
      if (!raw) return '';
      var cs = JSON.parse(raw);
      if (cs && typeof cs.night_number === 'number' && isFinite(cs.night_number) && cs.night_number > 0) {
        return String(Math.floor(cs.night_number));
      }
      if (cs && Array.isArray(cs.spent_conditions) && cs.spent_conditions.length > 0) {
        return String(cs.spent_conditions.length);
      }
    } catch (e) {}
    return '';
  }

  /**

  function resetAppStateForNextLogin() {

  function openWakeSurveyIfConfigured(sessionDoc, surveyData) {

      surveyData = surveyData || {};
      var periods = sessionDoc.rem_periods || surveyData.rem_periods || [];
      var g = sessionDoc.general || {};
      var pid = String(sessionDoc.participant_id || '');
      var params = new URLSearchParams();

      params.set('pid', pid);

      params.set('induction_highest_volume', g.induction_highest_volume != null ? String(g.induction_highest_volume) : '');
      params.set('wake_time', g.device_time_end || '');
      params.set('rem_motion_avg', g.rem_motion_avg != null ? String(g.rem_motion_avg) : '');
      if (g.motion_80pct_cutoff_first_4h != null) params.set('motion_80pct_cutoff_first_4h', String(g.motion_80pct_cutoff_first_4h));
      params.set('rem_episode_count', g.rem_episode_count != null ? String(g.rem_episode_count) : String(periods.length));
      params.set('app_version', String(g.app_version || 'luci2026'));
      params.set('train_cap_reached_count', String(g.train_cap_reached_count != null ? g.train_cap_reached_count : 0));
      params.set('total_trains_delivered', String(g.total_trains_delivered != null ? g.total_trains_delivered : 0));

  function buildFirestoreUploadDocs(doc) {

    // Find chunk sizes with a size-checked greedy pass.

      var high = motion.length - index;

          session_chunked: true,
          motion_series_chunk_index: total,
          motion_series_chunk_count: null,
          motion_per_second_series: motion.slice(index, index + mid)

        var testSize = estimateDocSizeBytes(testPrimary);
        if (testSize <= FIRESTORE_DOC_SOFT_LIMIT_BYTES) {

          low = mid + 1;
        } else {

        }
      }
      var chunk = motion.slice(index, index + best);
      docs.push(chunk);
      total++;
      index += best;
    }

    // Build first doc with full metadata/rem_periods + first chunk.
    var first = Object.assign({}, base, {
      session_group_id: groupId,
      session_chunked: true,
      motion_series_chunk_index: 0,
      motion_series_chunk_count: total,
      motion_per_second_series: docs[0]
    });
    var out = [first];

    // Additional docs carry only chunk payload + minimal fields.
    for (var i = 1; i < docs.length; i++) {
      out.push({
        participant_id: doc.participant_id,
        session_group_id: groupId,
        session_chunked: true,
        session_chunk_only: true,
        motion_series_chunk_index: i,
        motion_series_chunk_count: total,
        device_time_start: doc && doc.general ? doc.general.device_time_start : null,
        device_time_end: doc && doc.general ? doc.general.device_time_end : null,
        condition: doc && doc.general ? doc.general.condition : null,
        motion_per_second_series: docs[i]
      });
    }

    return out;
  }

  function saveLocalSessionBackup(reason) {
    if (!state.pid) return Promise.resolve(false);
    var built = buildSleepSessionPayload('local_backup');
    var snapshot = {
      saved_at: new Date().toISOString(),
      reason: String(reason || 'periodic'),
      pid: state.pid,
      app_step: state.appStep,
      seconds_recorded: state.secondsRecorded,
      firestore_doc: built.firestoreDoc,
      pending_queue_size: loadPendingSleepDocs().length
    };

    var Cap = window.Capacitor;
    var FS = Cap && Cap.Plugins && Cap.Plugins.Filesystem;
    var isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
    if (isNative && FS && typeof FS.writeFile === 'function') {
      var paths = getBackupFilePathCandidates(state.pid);
      var dirs = getBackupDirectoryCandidates(FS);
      var attempts = [];
      var di = 0;
      var pi = 0;
      var payload = JSON.stringify(snapshot);

      var tryWrite = function() {
        if (di >= dirs.length) return Promise.resolve(false);
        if (pi >= paths.length) { di++; pi = 0; return tryWrite(); }
        var directory = dirs[di];
        var path = paths[pi++];
        return ensureBackupParentDirectory(FS, directory, path).then(function() {

            path: path,
            data: payload,
            directory: directory,
            encoding: 'utf8',
            recursive: true
          });
        }).then(function() {
          saveLastBackupNativeLocation(state.pid, path, directory);
          return true;
        }).catch(function(err) {
          attempts.push({
            path: path,
            directory: String(directory),
            message: err && (err.message || err.error || String(err)) || 'unknown'

          return tryWrite();
        });
      };

        appendFirebaseSyncFailure('local_backup_write_failed', null, {
          pid: state.pid || '',
          reason: reason || '',
          attempts: attempts
        });
        try {
          localStorage.setItem(getLocalSessionBackupStorageKey(state.pid), JSON.stringify(snapshot));
        } catch (e) {}
        return false;
      });
    }
    try {
      localStorage.setItem(getLocalSessionBackupStorageKey(state.pid), JSON.stringify(snapshot));
      return Promise.resolve(true);
    } catch (e2) {
      appendFirebaseSyncFailure('local_backup_localstorage_failed', e2, { pid: state.pid || '', reason: reason || '' });
      return Promise.resolve(false);
    }
  }

  function loadLocalSessionBackupSnapshot(pid) {
    var key = getLocalSessionBackupStorageKey(pid);

    try {
      var raw = localStorage.getItem(key);

    } catch (e) {
      fallback = null;
    }

    var Cap = window.Capacitor;
    var FS = Cap && Cap.Plugins && Cap.Plugins.Filesystem;
    var isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());

    var combos = [];
    var remembered = loadLastBackupNativeLocation(pid);
    if (remembered && remembered.path) {

    }
    var dirs = getBackupDirectoryCandidates(FS);
    var paths = getBackupFilePathCandidates(pid);
    dirs.forEach(function(d) {
      paths.forEach(function(p) {
        combos.push({ path: p, directory: d });
      });
    });
    var seen = {};
    combos = combos.filter(function(c) {
      var k = String(c.path) + '|' + String(c.directory);
      if (seen[k]) return false;
      seen[k] = true;
      return true;

  function enqueuePendingSleepDoc(docOrDocs) {

    var getDocStableKey = function(doc) {

      var g = doc.general || {};
      var start = g.device_time_start || doc.device_time_start || '';
      var end = g.device_time_end || doc.device_time_end || '';
      var cond = (g.condition != null) ? g.condition : (doc.condition != null ? doc.condition : '');
      var pid = doc.participant_id || '';

      else if (queue[i] && queue[i].doc) existingDocs = [queue[i].doc];
      if (getItemStableKey(existingDocs) === incomingKey) {
        queue[i] = { docs: docs, saved_at: nowIso };
        replaced = true;
        break;
      }

    if (!replaced) queue.push({ docs: docs, saved_at: nowIso });
    if (queue.length > 10) queue = queue.slice(queue.length - 10);

  function flushPendingSleepDocs() {
    if (!db) return Promise.resolve();
    var queue = loadPendingSleepDocs();
    if (!queue.length) return Promise.resolve();
    var sendOne = function(item) {
      var docs = [];
      if (item && Array.isArray(item.docs)) docs = item.docs;
      else if (item && item.doc) docs = [item.doc]; // backward compatibility
      if (!docs.length) return Promise.resolve();
      var pOne = Promise.resolve();
      docs.forEach(function(d) {
        if (!d || !d.participant_id) return;
        var uploadDocs = buildFirestoreUploadDocs(d);
        if (!uploadDocs || !uploadDocs.length) return;
        uploadDocs.forEach(function(u) {
          pOne = pOne.then(function() {
            return db.collection('sleep_studies').doc(String((u && u.participant_id) || d.participant_id)).collection('sessions').add(u);
          });
        });
      });
      return pOne;
    };
    var p = Promise.resolve();
    queue.forEach(function(item) { p = p.then(function() { return sendOne(item); }); });
    return p.then(function() {
      savePendingSleepDocs([]);
      console.log('Flushed pending sessions:', queue.length);

  function ensureAuthThen(run) {
