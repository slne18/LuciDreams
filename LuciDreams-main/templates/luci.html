<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuciDreams Web v2026</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Flutter / Material 3 inspired dark theme */
    :root {
      --bg-dark: #0d1117;
      --bg-gradient-end: #161b22;
      --surface: #21262d;
      --surface-elevated: #30363d;
      --surface-overlay: #484f58;
      --primary: #58a6ff;
      --primary-container: rgba(88, 166, 255, 0.16);
      --primary-accent: #79c0ff;
      --green-accent: #3fb950;
      --green-container: rgba(63, 185, 80, 0.16);
      --red-accent: #f85149;
      --red-container: rgba(248, 81, 73, 0.16);
      --orange-accent: #d29922;
      --orange-container: rgba(210, 153, 34, 0.16);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --text-tertiary: #6e7681;
      --outline: rgba(255,255,255,0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --elevation-1: 0 1px 2px rgba(0,0,0,0.24);
      --elevation-2: 0 4px 12px rgba(0,0,0,0.32);
      --elevation-3: 0 8px 24px rgba(0,0,0,0.4);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.luci {
      background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-gradient-end) 100%);
      color: var(--text);
      font-family: "Segoe UI", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    .luci .app-bar {
      width: 100%;
      padding: 20px 20px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--outline);
      box-shadow: var(--elevation-1);
      text-align: center;
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .luci .content {
      flex: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px 32px;
      box-sizing: border-box;
    }
    .luci .step-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--outline);
      box-shadow: var(--elevation-2);
      padding: 28px 24px 32px;
      min-height: 200px;
    }
    .luci .step-content.training-layout {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .luci input[type="text"] {
      width: 100%;
      max-width: 280px;
      padding: 14px 18px;
      font-size: 1rem;
      background: var(--surface-elevated);
      border: 1.5px solid var(--outline);
      border-radius: var(--radius-md);
      color: var(--text);
      text-align: center;
      box-sizing: border-box;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .luci input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-container);
    }
    .luci input[type="text"]::placeholder {
      color: var(--text-tertiary);
    }
    .luci textarea {
      font-family: inherit;
      font-size: 0.9375rem;
      background: var(--surface-elevated);
      border: 1.5px solid var(--outline);
      border-radius: var(--radius-md);
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .luci textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-container);
    }
    .luci .btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      background: var(--primary);
      color: #0d1117;
      box-shadow: var(--elevation-1);
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);

    .luci .btn:hover { box-shadow: 0 4px 12px rgba(88, 166, 255, 0.35); }

      background: var(--green-accent);
      color: #0d1117;

    .luci .btn-green:hover { box-shadow: 0 4px 12px rgba(63, 185, 80, 0.35); }
    .luci .btn-red {
      background: var(--red-accent);
      color: #fff;
    }
    .luci .btn-red:hover { box-shadow: 0 4px 12px rgba(248, 81, 73, 0.4); }
    .luci .btn-orange {
      background: var(--orange-accent);
      color: #0d1117;
    }
    .luci .btn-orange:hover { box-shadow: 0 4px 12px rgba(210, 153, 34, 0.35); }

      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.4;
      color: var(--text);
    }
    .luci .text-body {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-muted);
    }
    .luci .text-center { text-align: center; }
    .luci .icon-lg {
      font-size: 3rem;
      margin-bottom: 4px;
      line-height: 1;
    }
    .luci .divider {

      height: 1px;
      background: var(--outline);
      margin: 8px 0;
    }
    .luci .row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .luci .volume-display { font-size: 2.5rem; font-weight: 300; letter-spacing: -0.02em; }

      height: 40px;

      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .luci .voice-rec-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-top: 12px;
      background: transparent !important;
    }
    .luci .voice-rec-block .voice-rec-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: transparent !important;

      font-size: 0.95rem;
      color: var(--red-accent);
      min-width: 4ch;
      text-align: center;
      background: transparent !important;

    .luci .voice-rec-block .btn {
      background: var(--primary) !important;
      color: #0d1117 !important;
    }
    .luci .voice-rec-block .btn-red {
      background: var(--red-accent) !important;
      color: #fff !important;
    }
    .luci .training-wave {
      width: 220px;
      height: 72px;
      margin: 14px auto 8px auto;
      border-radius: 14px;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(99, 102, 241, 0.95) 0 8px,
        rgba(148, 163, 184, 0.12) 8px 14px,
        rgba(34, 197, 94, 0.9) 14px 22px,
        rgba(148, 163, 184, 0.12) 22px 28px,
        rgba(59, 130, 246, 0.95) 28px 36px,
        rgba(148, 163, 184, 0.12) 36px 42px

      animation: trainingPulse 1.2s ease-in-out infinite;
    }
    @keyframes trainingPulse {
      0%, 100% { transform: scaleY(0.86); opacity: 0.7; }
      50% { transform: scaleY(1.04); opacity: 1; }
    }
    .luci .training-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 8px 0 6px 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .luci .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--outline);
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .luci .icon-btn:active {
      transform: scale(0.96);
      filter: brightness(0.95);
    }
    .luci .icon-btn-white {
      background: #fff;
      color: #111827;
    }
    .luci .icon-btn-red {
      background: var(--red-accent);
      color: #fff;
      border-color: rgba(239, 68, 68, 0.65);
    }
    .luci .pause-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .luci .pause-glyph .bar {
      width: 4px;
      height: 14px;
      border-radius: 1px;
      background: #fff;
      display: inline-block;
    }
    .luci .play-glyph {
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #fff;
      margin-left: 2px;
      display: inline-block;
    }
    .luci .hidden { display: none !important; }
    .luci .snackbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      color: var(--text);
      padding: 14px 24px;
      border-radius: var(--radius-lg);
      font-size: 0.9375rem;
      font-weight: 500;
      box-shadow: var(--elevation-3);
      border: 1px solid var(--outline);
      z-index: 1000;
    }
  </style>

        .catch(function(e) {

      return ok;

          start_epoch_sec: start,
          duration_sec: dur,
          device_time_start: remEpisodes[e].device_time_start,
          avg_motion: sum / dur
        });
      }
    }
    if (motion.length > gate) {
      var inRem = {};
      for (var e = 0; e < remEpisodes.length; e++) {
        var start = remEpisodes[e].start_epoch_sec;
        var dur = remEpisodes[e].duration_sec;
        for (var k = 0; k < dur && start + k < motion.length; k++) inRem[start + k] = true;
      }
      sum = 0;
      var count = 0;
      for (var i = gate; i < motion.length; i++) {
        if (!inRem[i]) { sum += motion[i]; count++; }
      }
      if (count > 0) intermediate_avg = sum / count;
    }
    return { baseline_avg: baseline_avg, rem_episode_averages: rem_episode_averages, intermediate_avg: intermediate_avg };
  }

  // Handles episode motion avg.
  function episodeMotionAvg(startSec, durationSec) {
    var motion = state.motionSamplesForBackend;
    if (startSec + durationSec > motion.length || durationSec <= 0) return null;
    var sum = 0;
    for (var i = 0; i < durationSec; i++) sum += motion[startSec + i] || 0;
    return sum / durationSec;
  }

  /** Native bridge status as object (Firestore); Qualtrics uses JSON string of same shape. */
  function buildNativeApiStatusObject() {
    var Cap = window.Capacitor;
    var native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
    return {
      is_native: native,
      torch: !!window.luciUseNativeTorch,
      haptics: !!window.luciUseNativeHaptics,
      native_audio: !!window.luciUseNativeAudio
    };
  }

  /**
   * Aggregates from finalized rem_periods[] — same numbers/text as Qualtrics embedded fields.
   * Flat `trains` entries include episode_index / train_index for joins with rem_periods.
   */
  function computeStimulationRollups(rem_periods) {
    var periods = rem_periods || [];
    var induction_cues = [];
    var trains_flat = [];
    var train_starts = [];
    var total_train_count = 0;
    var arousal_reached_count = 0;
    var induction_highest_volume = null;
    var ei, tj, ck, ep, trs, tr, d, cues, c;

    for (ei = 0; ei < periods.length; ei++) {
      ep = periods[ei];
      trs = ep.trains || [];
      total_train_count += trs.length;
      for (tj = 0; tj < trs.length; tj++) {
        tr = trs[tj];
        var dType = tr && tr.disruptive ? tr.disruptive.condition : null;
        var flatTrain = {
          episode_index: ei,
          train_index: tj,
          end_epoch_sec: tr.end_epoch_sec != null ? tr.end_epoch_sec : null,
          disruptive: tr.disruptive || {},
          induction: tr.induction || { cues: [], arousal_threshold: null }
        };
        if (dType !== 3) flatTrain.duration_sec = tr.duration_sec != null ? tr.duration_sec : null;
        trains_flat.push(flatTrain);
        d = tr.disruptive || {};
        if (d.device_time_start) train_starts.push(d.device_time_start);
        cues = (tr.induction && tr.induction.cues) || [];
        for (ck = 0; ck < cues.length; ck++) {
          c = cues[ck];
          induction_cues.push({
            episode_index: ei,
            train_index: tj,
            volume: c.volume,
            epoch_sec: c.epoch_sec,
            took_place: c.took_place,
            arousal_detected: c.arousal_detected
          });
          if (c.arousal_detected) arousal_reached_count++;
          if (c.volume != null && (induction_highest_volume === null || c.volume > induction_highest_volume)) {
            induction_highest_volume = c.volume;
          }
        }
      }
    }
    train_starts.sort();

    var rem_motion_weighted = 0;
    var rem_motion_dur = 0;
    for (ei = 0; ei < periods.length; ei++) {
      var ma = periods[ei].motion_avg;
      var du = periods[ei].duration_sec || 0;
      if (ma != null && du > 0) {
        rem_motion_weighted += ma * du;
        rem_motion_dur += du;
      }
    }
    var rem_motion_avg = rem_motion_dur > 0 ? rem_motion_weighted / rem_motion_dur : null;

    return {
      induction_cues: induction_cues,
      trains: trains_flat,
      train_starts: train_starts,
      total_train_count: total_train_count,
      arousal_reached_count: arousal_reached_count,
      induction_highest_volume: induction_highest_volume,
      rem_motion_avg: rem_motion_avg,
      train_cap_reached_count: total_train_count >= NIGHT_MAX_TRAINS ? 1 : 0,
      first_train_start_time: train_starts.length ? train_starts[0] : null,
      last_train_start_time: train_starts.length ? train_starts[train_starts.length - 1] : null
    };
  }

  // Returns stillness cutoff from series.
  function getStillnessCutoffFromSeries(series) {
    var s = series || [];
    if (!s.length) return null;
    var sorted = s.slice().sort(function(a, b) { return a - b; });
    var idx = Math.max(0, Math.min(sorted.length - 1, Math.floor((1 - REM_STILLNESS_PERCENT_OF_SERIES_MEAN) * (sorted.length - 1))));
    return sorted[idx];
  }

  // Returns current series stillness cutoff.
  function getCurrentSeriesStillnessCutoff() {
    var s = state.smoothedMotionSeries || [];
    return getStillnessCutoffFromSeries(s);
  }

  /**
   * Returns { firestoreDoc, surveyData }. Firestore includes full rem_periods (episodes + nested trains).
   * surveyData adds flat trains + motionAvgs for Qualtrics URL (motion breakdowns not stored in Firestore).
   */
  function buildSleepSessionPayload(activeMode) {
    var rawEpisodes = state.remEpisodes.slice();
    var totalRemMinutes = rawEpisodes.reduce(function(sum, ep) { return sum + Math.round((ep.duration_sec || 0) / 60); }, 0);
    var motionAvgs = computeMotionAverages();
    var cond = state.tonight_condition != null ? state.tonight_condition : null;
    var soundArousal = state.arousal_threshold != null && state.arousal_threshold > 0 ? state.arousal_threshold : (loadArousalThreshold() || null);
    var deviceTime = new Date().toISOString();
    var nightStartIso = state.sleepStartTime ? new Date(state.sleepStartTime).toISOString() : null;
    var nightNumStr = getNightNumberForSurvey(state.pid);
    var night_number = nightNumStr === '' ? null : Number(nightNumStr);

    var rem_periods = rawEpisodes.map(function(ep) {
      var durSec = ep.duration_sec || 0;
      var trains = (ep.trains || []).map(function(t) {
        var d = t.disruptive || {};
        var out = {
          end_epoch_sec: t.end_epoch_sec != null ? t.end_epoch_sec : null,
          disruptive: {
            start_epoch_sec: d.start_epoch_sec,
            condition: d.type != null ? d.type : null,
            device_time_start: d.device_time_start || null,
            took_place: !!d.took_place,
            params: d.params || {}
          },
          induction: {
            cues: (t.induction.cues || []).map(function(c) {
              return {
                volume: c.volume,
                epoch_sec: c.epoch_sec,
                took_place: c.took_place,
                arousal_detected: c.arousal_detected
              };
            }),
            arousal_threshold: t.induction.arousal_threshold
          }
        };
        if (d.type !== 3) out.duration_sec = t.duration_sec != null ? t.duration_sec : null;
        return out;
      });
      return {
        start_epoch_sec: ep.start_epoch_sec,
        duration_sec: durSec,
        device_time_start: ep.device_time_start || null,
        motion_avg: episodeMotionAvg(ep.start_epoch_sec, durSec),
        trains: trains
      };
    });

    var roll = computeStimulationRollups(rem_periods);
    var currentSeriesStillnessCutoff = getCurrentSeriesStillnessCutoff();
    // Persist per-second motion amount (not 80th-percentile cutoff series).
    var motionSeries = (state.motionSamplesForBackend || []).slice();

    var general = {
      session_type: activeMode,
      condition: cond,
      device_time_end: deviceTime,
      device_time_start: nightStartIso,
      night_number: night_number,
      epochs_count: state.epochs,
      motion_80pct_cutoff_current_series: currentSeriesStillnessCutoff,
      // Kept for backward compatibility with older exports/analytics expecting this key.
      motion_80pct_cutoff_first_4h: currentSeriesStillnessCutoff,
      rem_minutes: totalRemMinutes,
      rem_motion_avg: roll.rem_motion_avg,
      rem_episode_count: rem_periods.length,
      arousal_threshold: soundArousal,
      arousal_reached_count: roll.arousal_reached_count,
      induction_highest_volume: roll.induction_highest_volume,
      train_cap_reached_count: roll.train_cap_reached_count,
      first_train_start_time: roll.first_train_start_time,
      last_train_start_time: roll.last_train_start_time,
      native_api_status: buildNativeApiStatusObject(),
      night_max_trains: NIGHT_MAX_TRAINS,
      total_trains_delivered: roll.total_train_count,
      app_version: 'luci2026'
    };

    var firestoreDoc = {
      participant_id: state.pid,
      general: general
    };
    firestoreDoc.rem_dynamic_thresholds = {
      motion_per_second_series: motionSeries
    };
    if (cond !== 0) firestoreDoc.rem_periods = rem_periods;

    return {
      firestoreDoc: firestoreDoc,
      surveyData: {
        rem_periods: rem_periods,
        trains: roll.trains,
        motionAvgs: motionAvgs
      }
    };
  }

  /** Night index for this participant (1-based), from condition rotation localStorage. */
  function getNightNumberForSurvey(pid) {
    try {
      var raw = localStorage.getItem(getConditionStateKey(pid));
      if (!raw) return '';
      var cs = JSON.parse(raw);
      if (cs && Array.isArray(cs.spent_conditions) && cs.spent_conditions.length > 0) {
        return String(cs.spent_conditions.length);
      }
    } catch (e) {}
    return '';
  }

  /**
   * Qualtrics URL: send scalar fields only (no JSON payloads).
   */
  function openWakeSurveyIfConfigured(sessionDoc, surveyData) {
    if (!luciWakeSurveyUrl) return;
    try {
      surveyData = surveyData || {};
      var periods = sessionDoc.rem_periods || surveyData.rem_periods || [];
      var g = sessionDoc.general || {};
      var pid = String(sessionDoc.participant_id || '');
      var params = new URLSearchParams();
      var nn = g.night_number != null ? String(g.night_number) : getNightNumberForSurvey(pid);

      params.set('pid', pid);
      params.set('condition', g.condition != null ? String(g.condition) : '');
      params.set('night_number', nn);
      params.set('rem_minutes', g.rem_minutes != null ? String(g.rem_minutes) : '');
      params.set('arousal_threshold', g.arousal_threshold != null ? String(g.arousal_threshold) : '');
      params.set('arousal_reached_count', String(g.arousal_reached_count != null ? g.arousal_reached_count : 0));
      params.set('induction_highest_volume', g.induction_highest_volume != null ? String(g.induction_highest_volume) : '');
      params.set('wake_time', g.device_time_end || '');
      params.set('rem_motion_avg', g.rem_motion_avg != null ? String(g.rem_motion_avg) : '');
      if (g.motion_80pct_cutoff_first_4h != null) params.set('motion_80pct_cutoff_first_4h', String(g.motion_80pct_cutoff_first_4h));
      params.set('rem_episode_count', g.rem_episode_count != null ? String(g.rem_episode_count) : String(periods.length));
      params.set('app_version', String(g.app_version || 'luci2026'));
      params.set('train_cap_reached_count', String(g.train_cap_reached_count != null ? g.train_cap_reached_count : 0));
      params.set('total_trains_delivered', String(g.total_trains_delivered != null ? g.total_trains_delivered : 0));
      params.set('first_train_start_time', g.first_train_start_time != null ? String(g.first_train_start_time) : '');
      params.set('last_train_start_time', g.last_train_start_time != null ? String(g.last_train_start_time) : '');
      params.set('device_time_start', g.device_time_start != null ? String(g.device_time_start) : '');

      var base = luciWakeSurveyUrl;
      var sep = base.indexOf('?') >= 0 ? '&' : '?';
      var targetUrl = base + sep + params.toString();
      var popup = window.open(targetUrl, '_blank', 'noopener,noreferrer');
      // iOS webviews often block new-tab popups from async callbacks; force same-tab redirect.
      if (!popup) window.location.assign(targetUrl);
    } catch (e) {
      console.warn('Wake survey URL:', e);
    }
  }

  // Sends sleep data.
  function sendSleepData(activeMode) {
    if (!state.pid) return;

    var built = buildSleepSessionPayload(activeMode);
    var doc = built.firestoreDoc;
    if (!db) {
      showSnackbar('Not connected. Sending wake survey only.');
      openWakeSurveyIfConfigured(doc, built.surveyData);
      return;
    }
    if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
      doc.server_timestamp = firebase.firestore.FieldValue.serverTimestamp();
    }
    // For Firestore TTL policy: auto-delete session docs after retention window.
    doc.expires_at = new Date(Date.now() + DATA_RETENTION_MS);
    if (!doc.general) doc.general = {};
    doc.general.data_retention_hours = DATA_RETENTION_HOURS;

    db.collection('sleep_studies').doc(state.pid).collection('sessions').add(doc)
      .then(function() {
        state.motionSamplesForBackend = [];
        state.soundLog = [];
        console.log('Data synced to Firestore:', activeMode);
        openWakeSurveyIfConfigured(doc, built.surveyData);
      })
      .catch(function(err) {
        console.error(err);
        showSnackbar('Sync Error: Check Connection');
        openWakeSurveyIfConfigured(doc, built.surveyData);
      });
  }

  // Handles wake up.
  function wakeUp() {
    if (state.inRemEpisode && state.remEpisodeStartTime) {
      var dur = state.secondsRecorded - state.remEpisodeStartSeconds;
      var trains = state.currentEpisodeTrains ? state.currentEpisodeTrains.slice() : [];
      if (trains.length) {
        var last = trains[trains.length - 1];
        if (last.disruptive && last.end_epoch_sec == null) {
          last.end_epoch_sec = state.secondsRecorded;
          last.duration_sec = state.secondsRecorded - last.disruptive.start_epoch_sec;
        }
      }
      state.remEpisodes.push({
        start_epoch_sec: state.remEpisodeStartSeconds,
        duration_sec: dur,
        device_time_start: state.remEpisodeStartTime,
        trains: trains
      });
      state.inRemEpisode = false;
      state.currentRemEpisodeEntryThreshold = null;
    }
    disableNoSleep();
    if (state.accelHandler) {
      window.removeEventListener('devicemotion', state.accelHandler);
      state.accelHandler = null;
    }
    if (state.motionSampleTimer) clearInterval(state.motionSampleTimer);
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = null;
    state.fakeRemTestActive = false;
    if (state.fakeRemTestTimeoutId) {
      clearTimeout(state.fakeRemTestTimeoutId);
      state.fakeRemTestTimeoutId = null;
    }
    state.fakeTestSequenceActive = false;
    if (nextTrainTimeoutId) { clearTimeout(nextTrainTimeoutId); nextTrainTimeoutId = null; }
    clearDisruptiveTimeouts();
    cancelScheduledCue();
    stopSound();
    sendSleepData('wake_final');
    state.appStep = 0;
    state._voiceCheckDone = false;
    state.epochs = 0;
    state.totalStimCount = 0;
    render();
  }

  // Applies config data.
  function applyConfigData(pid) {
    state.pid = pid;
    state.beepDurationMs = DEFAULT_BEEP_DURATION_MS;
    state.intervalSeconds = 10;
    ensureConditionForTonight(pid);
    state.appStep = 1;
    render();
    setTimeout(checkNativeApisOnLogin, 800);
  }

  // Saves pasted lab config.
  function savePastedLabConfig(jsonText) {
    try {
      var config = JSON.parse(jsonText);
      if (!config || !config.apiKey) { showSnackbar('Invalid config: need at least apiKey'); return; }
      localStorage.setItem(LAB_CONFIG_KEY, JSON.stringify(config));
      showSnackbar('Lab config saved. Reloading…');
      window.location.reload();
    } catch (e) { showSnackbar('Invalid JSON: ' + (e.message || 'parse error')); }
  }

  // Fetches config.
  function fetchConfig() {
    const pid = (document.getElementById('pidInput') || pidInput).value.trim();
    if (!pid) return;
    applyConfigData(pid);
  }

  // Renders.
  function render() {
    const container = document.getElementById('stepContent');
    if (!container) return;
    if (container.classList && container.classList.toggle) {
      container.classList.toggle('training-layout', state.appStep === 'training');
    }

    // Handles el.
    function el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        if (k === 'className') e.className = attrs[k];
        else if (k === 'onClick') e.addEventListener('click', attrs[k]);
        else if (k === 'style') Object.assign(e.style, attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
      if (children) children.forEach(function(c) { e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }

    container.innerHTML = '';

    if (state.appStep !== 3 && state._volumeWatchActive) {
      state._volumeWatchActive = false;
      clearVolumeWatch();
    }
    if (state.appStep !== 'training' && state.trainingActive) {
      stopTrainingPhase();
    }

    switch (state.appStep) {
      case -1: {
        container.appendChild(el('p', { className: 'text-title' }, ['Lab setup']));
        container.appendChild(el('p', { className: 'text-body' }, [
          'To connect to your lab\'s database, open the link (or scan the QR code) your researcher sent you in this browser. The app will then use your lab\'s Firebase for this device.'
        ]));
        container.appendChild(el('p', { className: 'text-body', style: { marginTop: '12px', fontSize: '0.9rem' } }, [
          'If you have a Firebase config JSON from your lab, you can paste it below.'
        ]));
        var ta = document.createElement('textarea');
        ta.placeholder = 'Paste Firebase config JSON here (e.g. { "apiKey": "...", "projectId": "...", ... })';
        ta.rows = 4;
        ta.style.width = '100%';
        ta.style.marginTop = '8px';
        ta.style.padding = '8px';
        ta.style.boxSizing = 'border-box';
        container.appendChild(ta);
        container.appendChild(el('div', { style: { height: '12px' } }));
        container.appendChild(el('button', { className: 'btn', onClick: function() { savePastedLabConfig(ta.value); } }, ['Save and connect']));
        break;
      }
      case 0: {
        container.appendChild(el('p', { className: 'text-title' }, ['Enter Participant ID']));
        const input = pidInput.cloneNode(true);
        input.value = state.pid;
        input.id = 'pidInput';
        container.appendChild(input);
        container.appendChild(el('div', { style: { height: '30px' } }));
        const btn = el('button', { className: 'btn', onClick: fetchConfig }, ['Continue']);
        container.appendChild(btn);
        break;
      }
      case 1: {
        if (!state._voiceCheckDone) {
          state._voiceCheckDone = true;
          hasVoiceForPid(state.pid, function(has) { state.hasVoiceRecording = has; render(); });
        }
        container.appendChild(el('p', { className: 'text-title' }, ['Record your cue']));
        container.appendChild(el('p', { className: 'text-body', style: { whiteSpace: 'pre-line', textAlign: 'left' } }, [
          'Record a short sentence (2–4 seconds), for example: "I am dreaming."\n\nTap Record, then speak clearly. Stop when done.'
        ]));
        if (state.hasVoiceRecording) {
          container.appendChild(el('button', { className: 'btn', onClick: function() { state.appStep = 'training'; state._voiceCheckDone = false; state.trainingComplete = false; render(); } }, ['Use existing recording']));
          container.appendChild(el('div', { style: { height: '8px' } }));
          container.appendChild(el('button', { className: 'btn', onClick: function() { state._recordingAgain = true; state.hasVoiceRecording = false; state._voiceCheckDone = true; render(); } }, ['Record again (replaces previous)']));
        } else {
          var recDiv = document.createElement('div');
          recDiv.id = 'voiceRecDiv';
          recDiv.className = 'voice-rec-block';
          var recRow = document.createElement('div');
          recRow.className = 'voice-rec-row';
          var recBtn = el('button', { className: 'btn', id: 'voiceRecBtn' }, ['Record (2–4 s)']);
          var stopBtn = el('button', { className: 'btn btn-red', id: 'voiceStopBtn', style: { display: 'none' } }, ['Stop']);
          var recDuration = document.createElement('span');
          recDuration.id = 'voiceDuration';
          recDuration.className = 'voice-duration';
          recDuration.textContent = '0.0 s';
          recRow.appendChild(recBtn);
          recRow.appendChild(stopBtn);
          recRow.appendChild(recDuration);
          recDiv.appendChild(recRow);
          container.appendChild(recDiv);
          (function() {
            var mediaRecorder = null;
            var chunks = [];
            var startTs = 0;
            var durationInterval = null;
            // Updates duration.
            function updateDuration() {
              var el = document.getElementById('voiceDuration');
              if (!el) return;
              var sec = ((Date.now() - startTs) / 1000).toFixed(1);
              el.textContent = sec + ' s';
              if (Date.now() - startTs >= VOICE_RECORD_MAX_MS) stopRecording();
            }
            // Stops recording.
            function stopRecording() {
              if (durationInterval) clearInterval(durationInterval);
              durationInterval = null;
              if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }
            // Handles on record click.
            function onRecordClick() {
              if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showSnackbar('Microphone not supported.');
                return;
              }
              navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];
                mediaRecorder.ondataavailable = function(e) { if (e.data.size) chunks.push(e.data); };
                mediaRecorder.onstop = function() {
                  stream.getTracks().forEach(function(t) { t.stop(); });
                  var durationMs = Date.now() - startTs;
                  if (durationMs < VOICE_RECORD_MIN_MS) {
                    showSnackbar('Record at least 2 seconds.');
                    var rb = document.getElementById('voiceRecBtn');
                    var sb = document.getElementById('voiceStopBtn');
                    if (rb) rb.style.display = '';
                    if (sb) sb.style.display = 'none';
                    return;
                  }
                  if (durationMs > VOICE_RECORD_MAX_MS + 50) {
                    showSnackbar('Recording must be 4 seconds maximum.');
                    var rb = document.getElementById('voiceRecBtn');
                    var sb = document.getElementById('voiceStopBtn');
                    if (rb) rb.style.display = '';
                    if (sb) sb.style.display = 'none';
                    return;
                  }
                  var blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                  setVoiceBlob(state.pid, blob, function(ok) {
                    if (ok) {
                      state.hasVoiceRecording = true;
                      showSnackbar('Recording saved. Use it or record again.');
                    } else showSnackbar('Could not save recording.');
                    render();
                  });
                };
                mediaRecorder.start();
                startTs = Date.now();
                durationInterval = setInterval(updateDuration, 200);
                var rb = document.getElementById('voiceRecBtn');
                var sb = document.getElementById('voiceStopBtn');
                if (rb) rb.style.display = 'none';
                if (sb) sb.style.display = '';
              }).catch(function() { showSnackbar('Microphone access denied.'); });
            }
            // Handles on stop click.
            function onStopClick() { stopRecording(); }
            recBtn.onclick = onRecordClick;
            stopBtn.onclick = onStopClick;
          })();
        }
        break;
      }
      case 'training': {
        startTrainingPhaseIfNeeded();
        container.appendChild(el('p', { className: 'text-title' }, ['Praticing Lucidity']));
        container.appendChild(el('p', { className: 'text-body', style: { marginBottom: '8px' } }, [
          'Listen to the cues and practice recognizing the lucid reminder.'
        ]));
        var controls = document.createElement('div');
        controls.className = 'training-controls';
        var restartBtn = el('button', { className: 'icon-btn icon-btn-white', title: 'Restart from intro', onClick: restartTrainingFromBeginning }, ['↺']);
        var wave = el('div', { className: 'training-wave' });
        var pauseGlyph = state.trainingPaused
          ? el('span', { className: 'play-glyph' }, [])
          : el('span', { className: 'pause-glyph' }, [el('span', { className: 'bar' }, []), el('span', { className: 'bar' }, [])]);
        var pauseBtn = el('button', { className: 'icon-btn icon-btn-red', title: state.trainingPaused ? 'Resume training' : 'Pause training', onClick: toggleTrainingPause }, [pauseGlyph]);
        controls.appendChild(restartBtn);
        controls.appendChild(wave);
        controls.appendChild(pauseBtn);
        container.appendChild(controls);
        var remaining = Math.max(0, state.trainingRemainingSec || 0);
        var min = Math.floor(remaining / 60);
        var sec = String(remaining % 60).padStart(2, '0');
        container.appendChild(el('p', { className: 'text-body', style: { color: 'var(--text-muted)', fontSize: '0.9rem' } }, [
          'Time remaining: ' + String(min) + ':' + sec
        ]));
        container.appendChild(el('div', { style: { height: '6px' } }));
        container.appendChild(el('button', { className: 'btn btn-red', onClick: skipTrainingPhase }, ['Skip training']));
        break;
      }
      case 2: {
        if (getMotionGranted(state.pid)) {
          var savedBaseline = loadBaselineVolume(state.pid);
          if (savedBaseline != null && savedBaseline > 0) {
            state.userMinVolume = savedBaseline;
            state.titrationCeiling = Math.min(1, savedBaseline + USER_MIN_VOLUME_CEILING_DELTA);
            state.finalSleepVolume = savedBaseline;
            state.baselineSliderVolume = Math.min(1, Math.max(0.01, savedBaseline));
            state.appStep = 4;
          } else {
            state.appStep = 3;
            state.baselineSliderVolume = state.userMinVolume != null ? Math.min(1, Math.max(0.01, state.userMinVolume)) : 0.1;
          }
          render();
          break;
        }
        container.appendChild(el('p', { className: 'icon-lg' }, ['🔐']));
        container.appendChild(el('p', { className: 'text-title', style: { color: 'var(--orange-accent)', fontWeight: 'bold' } }, ['IMPORTANT: Your screen must stay ON.']));
        container.appendChild(el('p', { className: 'text-body', style: { whiteSpace: 'pre-line' } }, ['1. Once started, Do NOT switch to another tab or app.\n1. Do NOT lock your phone.\n2. Do NOT close this browser tab.']));
        container.appendChild(el('div', { className: 'divider' }));
        container.appendChild(el('p', { className: 'text-body' }, ['We need to activate your device\'s motion sensor. To accept, click the button below.']));
        container.appendChild(el('div', { style: { height: '40px' } }));
        container.appendChild(el('button', { className: 'btn', onClick: handleStartSequence }, ['Allow motion sensor']));
        break;
      }
      case 3: {
        container.appendChild(el('p', { className: 'text-body', style: { marginBottom: '12px' } }, [
          'Set your phone volume to approximately 50% (you can use physical buttons or the Control Center slider), then click Continue.'
        ]));
        var initialVol = state.baselineSliderVolume != null ? Math.max(0, Math.min(1, state.baselineSliderVolume)) : 0.1;
        state.baselineSliderVolume = initialVol;
        var volumeBeepTimeout = null;
        // Applies volume change.
        function applyVolumeChange(vol) {
          vol = Math.max(0, Math.min(1, vol != null ? vol : 0));
          state.baselineSliderVolume = vol;
          if (volumeBeepTimeout) clearTimeout(volumeBeepTimeout);
          volumeBeepTimeout = setTimeout(function() {
            volumeBeepTimeout = null;
            playBeep(vol, state.beepDurationMs || 150);
          }, 200);
        }
        container.appendChild(el('div', { style: { height: '8px' } }));
        container.appendChild(el('button', { className: 'btn btn-green', onClick: setBaseline }, ['Continue']));
        var VP = getVolumePlugin();
        if (VP && !state._volumeWatchActive) {
          state._volumeWatchActive = true;
          // Keep normal system volume behavior on hardware buttons.
          var options = { suppressVolumeIndicator: false, disableSystemVolumeHandler: false };
          // New plugin API: watchVolume(options, callback)
          if (VP.watchVolume) {
            VP.watchVolume(options, function(a, b) {
              // Support both callback shapes: (result, err) and (err, result)
              var err = null;
              var ev = null;
              if (a && (a.direction || typeof a.value === 'number')) {
                ev = a;
                err = b;
              } else if (b && (b.direction || typeof b.value === 'number')) {
                ev = b;
                err = a;
              } else {
                ev = a || b || null;
              }
              if (err) return;
              if (ev && ev.direction) {
                var delta = ev.direction === 'up' ? CALIBRATION_VOLUME_STEP : -CALIBRATION_VOLUME_STEP;
                var next = Math.max(0, Math.min(1, (state.baselineSliderVolume != null ? state.baselineSliderVolume : initialVol) + delta));
                applyVolumeChange(next);
                return;
              }
              if (ev && typeof ev.value === 'number') {
                applyVolumeChange(ev.value);
              }
            }).catch(function() { state._volumeWatchActive = false; });
          } else {
            state._volumeWatchActive = false;
          }
        }
        break;
      }
      case 4: {
        container.appendChild(el('p', { className: 'text-body' }, [
          'All set! We\'re ready for you to go to sleep. Place the phone facedown on the bed with the screen on and keep it connected to the charger.'
        ]));
        container.appendChild(el('div', { style: { height: '24px' } }));
        if (!state.hasVoiceRecording) {
          hasVoiceForPid(state.pid, function(has) { if (has) { state.hasVoiceRecording = true; render(); } });
        }
        var startBtn = el('button', { className: 'btn btn-green', onClick: activateMotionAndStartSleep }, ['Start sleep']);
        if (!state.hasVoiceRecording) {
          startBtn.disabled = true;
          container.appendChild(el('p', { className: 'text-body', style: { fontSize: '0.85rem', color: 'var(--orange-accent)', marginTop: '6px' } }, ['Record your cue (step 1) before starting sleep.']));
        }
        container.appendChild(startBtn);
        break;
      }
      case 5: {
        container.appendChild(el('p', { className: 'text-body' }, [
          'When you wake up tap the button below.'
        ]));
        container.appendChild(el('p', { style: { color: 'var(--green-accent)', fontSize: '1.25rem' } }, ['🌙 Tracking Active']));
        var phaseLabel = state.trainPhase === 'disruptive'
          ? 'Disruptive'
          : state.trainPhase === 'induction'
          ? 'Induction'
          : 'Idle';
        container.appendChild(el('p', { className: 'text-body', style: { fontSize: '0.9rem', color: 'var(--primary-accent)', marginTop: '4px' } }, [
          'Current phase: ' + phaseLabel
        ]));
        if (state.trainPhase === 'induction') {
          var inductionPct = Math.round((Math.min(state.inductionCap || 1, state.inductionVolume || 0) || 0) * 100);
          container.appendChild(el('p', { className: 'text-body', style: { fontSize: '0.9rem', color: 'var(--text-muted)', marginTop: '2px' } }, [
            'Induction volume: ' + String(inductionPct) + '%'
          ]));
        }
        if (ENABLE_FAKE_REM_TEST) {
          var remToFake = Math.max(0, FAKE_REM_TRIGGER_AFTER_SEC - (state.secondsRecorded || 0));
          var fakeMsg = state.fakeRemTestActive
            ? 'TEMP TEST REM status: started'
            : ('TEMP TEST REM starts in: ' + String(remToFake) + 's');
          container.appendChild(el('p', { className: 'text-body', style: { fontSize: '0.9rem', color: 'var(--orange-accent)', marginTop: '4px' } }, [fakeMsg]));
        }
        var elapsedSec = state.secondsRecorded || 0;
        var elapsedStr = Math.floor(elapsedSec / 3600) + ':' + String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0') + ':' + String(elapsedSec % 60).padStart(2, '0');
        container.appendChild(el('p', { id: 'sleepTimer', style: { fontFamily: 'monospace', fontSize: '1.1rem', marginTop: '8px', color: 'var(--primary-accent)' } }, ['Elapsed: ' + elapsedStr]));
        container.appendChild(el('div', { className: 'spinner' }));
        container.appendChild(el('div', { style: { height: '24px' } }));
        container.appendChild(el('button', { className: 'btn btn-red', onClick: wakeUp }, ["I'm awake"]));
        break;
      }
      default:
        container.appendChild(el('p', {}, ['Error']));
    }
  }

  // Handles run when ready.
  function runWhenReady() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runWhenReady);
      return;
    }
    render();
  }
  runWhenReady();
})();
  </script>
</body>
</html>
